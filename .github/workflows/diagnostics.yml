name: Diagnostics — Telegram intake

# ARCHITECTURE.md §12 (preserved behavior): manual diagnostics workflow.
# The Gemini-capability job was removed together with the Gemini-based
# planning mode it existed to validate; the remaining job verifies §9.1
# public Telegram channel intake
#     end-to-end. POSITIVE: a known public channel post downloads and has a
#     positive duration. NEGATIVE: a public *group* link is rejected before
#     media processing. Both go through the real ingest path
#     (pipeline/stage_a/ingest.py -> pipeline/stage_a/telegram_channel.py)
#     via a synthetic jobs/<diag>/stage-a-request.json, exactly like a real
#     job. Secrets are referenced by name only (§13 invariant #1); they exist
#     only on the original repo, and the module fails closed without them —
#     which IS the security boundary's second layer.

on:
  workflow_dispatch:
    inputs:
      telegram_post:
        description: Public Telegram channel post URL containing one video
        required: true
        type: string
        default: https://t.me/yt4clipforge/2

permissions:
  contents: read

jobs:
  telegram-intake:
    name: Validate public Telegram intake
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Dedicated user-authorized MTProto session. GitHub masks encrypted
      # secret values, and the downloader never prints them.
      CLIPFORGE_TELEGRAM_API_ID: ${{ secrets.CLIPFORGE_TELEGRAM_API_ID }}
      CLIPFORGE_TELEGRAM_API_HASH: ${{ secrets.CLIPFORGE_TELEGRAM_API_HASH }}
      CLIPFORGE_TELEGRAM_SESSION: ${{ secrets.CLIPFORGE_TELEGRAM_SESSION }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and source downloader dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'yt-dlp[default]>=2026.1,<2027' 'requests>=2.32,<3' 'telethon>=1.44,<2' 'cryptg>=0.4,<1'

      - name: Stage a synthetic telegram_channel job request
        shell: bash
        env:
          TELEGRAM_POST: ${{ inputs.telegram_post }}
        run: |
          set -euo pipefail
          mkdir -p jobs/diag-telegram-intake work
          python - "$TELEGRAM_POST" <<'PY'
          import json, sys
          request = {
              "job_id": "diag-telegram-intake",
              "mode": "manual",
              "source": {"kind": "telegram_channel", "value": sys.argv[1]},
          }
          with open("jobs/diag-telegram-intake/stage-a-request.json", "w", encoding="utf-8") as fh:
              json.dump(request, fh, indent=2)
              fh.write("\n")
          PY

      - name: Download and verify the requested public Telegram channel source
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m pipeline.stage_a.ingest diag-telegram-intake work
          test -s work/source_input.bin || test -s work/original.*
          SOURCE_FILE="$(ls work/original.* 2>/dev/null || echo work/source_input.bin)"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$SOURCE_FILE")"
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if duration <= 0:
              raise SystemExit('Downloaded Telegram media has no positive duration.')
          print(f'Validated public Telegram channel video duration: {duration:.3f} seconds')
          PY

      - name: Verify public Telegram group links fail before media processing
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          mkdir -p jobs/diag-telegram-group
          python - <<'PY'
          import json
          request = {
              "job_id": "diag-telegram-group",
              "mode": "manual",
              "source": {"kind": "telegram_channel", "value": "https://t.me/motionsaltdownloads/2"},
          }
          with open("jobs/diag-telegram-group/stage-a-request.json", "w", encoding="utf-8") as fh:
              json.dump(request, fh, indent=2)
              fh.write("\n")
          PY
          set +e
          python -m pipeline.stage_a.ingest diag-telegram-group work-group > work-group/group-source.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the public Telegram group link to fail.' >&2
            exit 1
          fi
          # Telegram may label a group post as no accessible media in MTProto,
          # but it must never be accepted as a Stage A source.
          echo 'Confirmed rejection for unsupported public Telegram group source.'

      - name: Remove synthetic diagnostic job folders
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf jobs/diag-telegram-intake jobs/diag-telegram-group
