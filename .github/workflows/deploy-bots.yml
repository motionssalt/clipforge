name: Deploy Bots — Cloudflare Workers

# ARCHITECTURE.md §12 (preserved behavior): on every bot/** change, run the
# bot test suite and then deploy Bot A and Bot B Workers. Ported from
# _legacy/.github/workflows/deploy-telegram-workers.yml with the layout
# updated: the workers now live in bot/ (npm + package-lock.json, Node >=20,
# ESM tests via `npm test`), and the two wrangler configs are
# bot/wrangler.bot-a.jsonc / bot/wrangler.bot-b.jsonc.
#
# Secrets are referenced by name only (§13 invariant #1):
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token with Workers edit rights
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
# Worker runtime secrets (TELEGRAM_BOT_TOKEN, KV_ENCRYPTION_KEY, …) are NOT
# set here — they are managed with `wrangler secret put` per the comments in
# each wrangler config and are never touched by CI.
#
# bug-58: a failed test step used to silently skip the wrangler deploys — the
# only "alert" was the Actions UI, so blocked deploys were discovered by the
# user noticing a landed fix still misbehaving live (see bug-56). The final
# step below (`if: failure()`) pages the owner on Telegram whenever an
# earlier step in this workflow fails. It uses Bot B's token
# (BOTB_MTPROTO_BOT_TOKEN, already an Actions secret on this central repo
# for telegram-relay.yml) and posts to DEPLOY_ALERT_CHAT_ID when that secret
# is set, falling back to the internal relay group (-5405387856, same
# non-secret id as INTERNAL_RELAY_GROUP_CHAT_ID in bot/wrangler.bot-a.jsonc
# — Bot B is a member there). No Cloudflare-scoped secret is touched by
# the alert path. The alert itself is best-effort: it must never mask the
# original failure.
#
# bug-68 / bug-63: Shadow Clones share the central Bot A (ARCHITECTURE.md
# §10: one shared Bot A serves all users) and have neither Cloudflare
# credentials nor a Bot B token of their own — they are not supposed to run
# their own Bot A/B Worker deployment at all. bug-63 fix: the wrangler
# deploy steps and the workflow-side Telegram alert step are gated to the
# central repo only via `if: github.repository == 'motionssalt/clipforge'`
# (same pattern as news-push.yml's rebroadcast job); on a clone they are
# genuinely skipped in the Actions UI instead of failing loudly on missing
# secrets. The bot test suite (npm ci + npm test) still runs on every repo
# — that is useful CI and needs no secrets. Clone owners are still notified
# of a failed Deploy Bots run by the shared Bot A polling their repo with
# their own PAT on the home-screen touchpoint (announceDeployFailure in
# bot/src/commands/start.js) — that mechanism triggers on the run's overall
# conclusion, not on this alert step, so failing bot tests on a clone still
# land in the owner's DM. The workflow-side alert step is the real-time
# alert for the main account and stays unchanged there.
#
# bug-63 (previous clone-side alert behavior, removed): the clone branch of
# the alert step used to `exit 1` on purpose so the run stayed visibly red
# in the Actions UI. With the wrangler deploy steps gated to central-only,
# a clone run only turns red when a genuine CI failure happens (e.g. bot
# tests failing) — that failing step keeps the run red on its own; the
# alert step no longer needs to force-fail on clones and is skipped there
# instead.

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/deploy-bots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bots
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Bot A + Bot B
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        run: npm ci --ignore-scripts

      - name: Run bot test suite
        run: npm test

      - name: Deploy Bot A Worker
        # bug-63: central-only — Shadow Clones share the central Bot A/B
        # deployment (§10) and have no Cloudflare credentials. Skipped on
        # every repo other than motionssalt/clipforge instead of failing
        # loudly on the missing CLOUDFLARE_API_TOKEN / ACCOUNT_ID.
        if: github.repository == 'motionssalt/clipforge'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          command: deploy --config wrangler.bot-a.jsonc

      - name: Deploy Bot B relay Worker
        # bug-63: central-only (same rationale as Deploy Bot A Worker above).
        if: github.repository == 'motionssalt/clipforge'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          command: deploy --config wrangler.bot-b.jsonc

      - name: Alert owner on Telegram when the deploy is blocked
        # bug-58: fires on ANY earlier step failure on this workflow — bot
        # tests failing (the documented silent-skip case), npm ci, or a
        # wrangler deploy itself. Best-effort: never turns a failed run into
        # a differently-failed run.
        #
        # bug-63: gated to central-only. On Shadow Clones the wrangler
        # deploy steps are also central-only (see above), so this step's
        # only remaining trigger there would be a failing test/install step,
        # which already keeps the run red on its own; and the clone owner
        # is notified separately by the shared Bot A's failed-Deploy-Bots
        # poll (announceDeployFailure in bot/src/commands/start.js), which
        # triggers on the run's overall conclusion, not on this step. The
        # previous clone branch (log-and-exit-1) is therefore removed.
        if: ${{ failure() && github.repository == 'motionssalt/clipforge' }}
        working-directory: .
        shell: bash
        env:
          ALERT_BOT_TOKEN: ${{ secrets.BOTB_MTPROTO_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.DEPLOY_ALERT_CHAT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${ALERT_BOT_TOKEN:-}" ]; then
            # Defensive: BOTB_MTPROTO_BOT_TOKEN is expected on the central
            # repo (used by telegram-relay.yml). If it's ever unset here,
            # log and self-skip — the Actions UI already shows the failure
            # and this step must not mask it.
            echo "BOTB_MTPROTO_BOT_TOKEN secret not available on the central repo — skipping workflow-side Telegram alert." >&2
            exit 0
          fi
          chat_id="${ALERT_CHAT_ID:-}"
          if [ -z "$chat_id" ]; then
            # Internal relay group — same id as INTERNAL_RELAY_GROUP_CHAT_ID in
            # bot/wrangler.bot-a.jsonc (a public var, not a secret).
            chat_id="-5405387856"
          fi
          short_sha="${GITHUB_SHA:0:7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          text="⚠️ Deploy blocked: a Deploy Bots step failed on commit ${short_sha}; the Cloudflare Workers were NOT fully updated. Check the Actions run: ${run_url}"
          payload=$(python3 -c 'import json,sys; print(json.dumps({"chat_id": sys.argv[1], "text": sys.argv[2], "disable_web_page_preview": True}))' "$chat_id" "$text")
          if curl --fail --silent --show-error --max-time 20 \
              -H 'Content-Type: application/json' -d "$payload" \
              "https://api.telegram.org/bot${ALERT_BOT_TOKEN}/sendMessage" >/dev/null; then
            echo "Deploy-failure alert sent to Telegram chat ${chat_id}."
          else
            echo "WARN: Telegram deploy-failure alert could not be delivered." >&2
          fi
          # Never fail (or change the outcome of) the workflow from here.
          exit 0
