name: Voice consistency validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize-three-cuts:
    name: Generate comparable narration cuts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate three real Gemini TTS samples
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEYS:-}" ]]; then
            echo "GEMINI_API_KEYS is not configured for this repository." >&2
            exit 2
          fi
          cat > /tmp/voice-consistency-production.json <<'JSON'
          {
            "cuts": [
              {"voiceover_text": "The cave was closing in, but Gon kept moving with everyone on his back."},
              {"voiceover_text": "Outside, the group finally had a clear path, and the danger started to fall behind them."},
              {"voiceover_text": "He never raised his voice; he simply kept going until every person was safe."}
            ]
          }
          JSON
          python scripts/generate_voiceover.py /tmp/voice-consistency-production.json voice-consistency-output
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("voice-consistency-output/voiceover_manifest.json").read_text())
          assert len(manifest["cuts"]) == 3
          assert {cut["voice"] for cut in manifest["cuts"]} == {"Charon"}
          assert {cut["model"] for cut in manifest["cuts"]} == {"gemini-2.5-flash-preview-tts"}
          print("Validated three generated Charon/Flash narration cuts.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: voice-consistency-samples
          path: voice-consistency-output/
          if-no-files-found: error
          retention-days: 1
