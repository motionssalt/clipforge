name: Voice audition

on:
  workflow_dispatch:
    inputs:
      voices:
        description: Comma-separated Gemini prebuilt voice names to compare
        required: false
        default: Charon,Iapetus,Orus
        type: string
      text:
        description: Optional identical narration line for all candidates
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  audition:
    name: Generate Gemini TTS audition samples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v4

      - name: Validate Gemini TTS credentials are configured
        shell: bash
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEYS:-}" ]; then
            echo "GEMINI_API_KEYS is not configured for this repository." >&2
            exit 2
          fi

      - name: Generate equal-script voice samples
        shell: bash
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -euo pipefail
          mkdir -p audition
          args=(--out-dir audition --voices "${{ inputs.voices }}")
          if [ -n "${{ inputs.text }}" ]; then
            args+=(--text "${{ inputs.text }}")
          fi
          python3 scripts/generate_voiceover_samples.py "${args[@]}"
          ls -lh audition/

      - name: Upload private audition audio
        uses: actions/upload-artifact@v4
        with:
          name: gemini-voice-audition-${{ github.run_id }}
          path: audition/
          if-no-files-found: error
          retention-days: 7
