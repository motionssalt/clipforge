name: Stage A — Ingest, Transcribe, Screenshot

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public video URL — Google Drive share link or any direct video file URL (mkv/mp4)"
        required: true
        type: string
      job_id:
        description: "Job id (short slug). Leave blank to auto-generate."
        required: false
        type: string
        default: ""
      whisper_model:
        description: "faster-whisper model size (CPU): tiny | base | small"
        required: false
        type: string
        default: "base"
      language:
        description: "Language hint for transcription (or 'auto')"
        required: false
        type: string
        default: "auto"
      target_duration_seconds:
        description: "Target total duration (seconds) of the final cut video the downstream agent should aim for."
        required: false
        type: string
        default: "120"
      focus:
        description: "Optional: narrow analysis to one specific scene/moment/plot thread (e.g. 'the confrontation between X and Y'). Leave blank to consider the whole video."
        required: false
        type: string
        default: ""
      enable_vision_assist:
        description: "Run local shot indexing (scene_index + key_moments + dense event composites). Set to 'false' to skip on very long videos."
        required: false
        type: string
        default: "true"

permissions:
  contents: write

concurrency:
  group: clipforge-stage-a-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  stage_a:
    name: Stage A
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve job id
        id: jid
        shell: bash
        run: |
          set -euo pipefail
          jid="${{ github.event.inputs.job_id }}"
          if [ -z "$jid" ]; then
            jid="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          fi
          # sanitize
          jid="$(echo "$jid" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')"
          echo "job_id=$jid" >> "$GITHUB_OUTPUT"
          echo "release_tag=clipforge-$jid" >> "$GITHUB_OUTPUT"
          echo "Job id: $jid"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg installation
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          # Pre-install numpy to satisfy pkuseg's build-time requirement.
          # chatterbox-tts 0.1.4 requires numpy<1.26.0,>=1.24.0.
          pip install "numpy>=1.24.0,<1.26.0"
          # pkuseg 0.0.25 (chatterbox-tts dep) requires numpy at build time
          # but lacks a pyproject.toml; install it without isolation.
          pip install pkuseg==0.0.25 --no-build-isolation
          pip install -r scripts/requirements.txt

      # ---------------------------------------------------------------
      # Verify the onnxruntime stack up-front.
      #
      # faster-whisper's Silero VAD filter imports `onnxruntime` in the
      # same process. If that module can't be imported cleanly (NumPy
      # ABI mismatch, wrong manylinux tag, etc.) transcription fails
      # with a very misleading
      #     RuntimeError: Applying the VAD filter requires the onnxruntime package
      # message — even though onnxruntime WAS installed, it just
      # wouldn't import at runtime.
      #
      # Doing an explicit sanity import here means any future ABI
      # regression fails LOUDLY with the real traceback, at install
      # time, before we've spent minutes downloading the source video
      # and extracting audio only to crash inside transcribe.py.
      # ---------------------------------------------------------------
      - name: Verify onnxruntime + faster-whisper VAD stack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys

          print(f"Python:  {sys.version.split()[0]}")

          import numpy as np
          print(f"numpy:   {np.__version__}")

          # This is the exact same import that faster-whisper's
          # SileroVADModel.__init__ does. If it raises here, the run stops
          # here with a real traceback instead of being re-raised as the
          # misleading "requires the onnxruntime package" RuntimeError
          # deep inside faster-whisper later on.
          import onnxruntime
          print(f"onnxruntime: {onnxruntime.__version__}")

          import faster_whisper
          print(f"faster-whisper: {faster_whisper.__version__}")

          # Confirm the VAD asset shipped with faster-whisper is present
          # and that a session can actually be created against it — this
          # is what the transcription step will do first when it starts.
          from faster_whisper.vad import SileroVADModel, get_assets_path
          import os
          vad_path = os.path.join(get_assets_path(), "silero_vad.onnx")
          assert os.path.exists(vad_path), f"missing VAD asset: {vad_path}"
          SileroVADModel(vad_path)
          print(f"Silero VAD session: OK ({vad_path})")
          PY

      - name: Write initial status (stage_a_running)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_status.py "${{ steps.jid.outputs.job_id }}" "stage_a_running" \
            --message "Downloading source video" \
            --release-tag "${{ steps.jid.outputs.release_tag }}"

      - name: Commit initial status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "jobs/${{ steps.jid.outputs.job_id }}/status.json"
          git commit -m "clipforge: init job ${{ steps.jid.outputs.job_id }}" || echo "nothing to commit"
          git push || echo "push failed (non-fatal for run)"

      - name: Download source video (Google Drive link or any direct URL)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python scripts/download_drive.py "${{ github.event.inputs.video_url }}" work/source_input.bin

          # Detect real container from bytes (the host may lie about extension).
          mime="$(file -b --mime-type work/source_input.bin || true)"
          echo "Detected mime: $mime"
          case "$mime" in
            video/x-matroska|application/x-matroska) ext="mkv" ;;
            video/mp4|application/mp4)               ext="mp4" ;;
            *)
              # Fall back to ffprobe: if it opens, keep as mkv (most permissive).
              if ffprobe -v error work/source_input.bin >/dev/null 2>&1; then
                ext="mkv"
              else
                echo "Downloaded file is not a recognized video container" >&2
                exit 1
              fi
              ;;
          esac
          mv work/source_input.bin "work/original.${ext}"
          echo "ORIGINAL_PATH=work/original.${ext}" >> "$GITHUB_ENV"
          ls -lh work/

      - name: Probe duration + build compressed analysis copy (720p, CRF 28)
        shell: bash
        run: |
          set -euo pipefail
          dur="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$ORIGINAL_PATH")"
          # round to int seconds
          dur_int="$(python -c "import sys; print(int(round(float(sys.argv[1]))))" "$dur")"
          echo "DURATION_SECONDS=$dur_int" >> "$GITHUB_ENV"
          echo "Duration: $dur ($dur_int s)"

          mkdir -p work/analysis
          # 720p max, CRF 28, AAC 96k. Filter '-2' keeps aspect ratio + even dims.
          ffmpeg -y -i "$ORIGINAL_PATH" \
            -vf "scale='min(1280,iw)':'-2'" \
            -c:v libx264 -preset veryfast -crf 28 \
            -c:a aac -b:a 96k \
            work/analysis/compressed.mp4
          ls -lh work/analysis/compressed.mp4

      - name: Extract 6-frame composite screenshots (one file per 6s window)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/screenshots work/screenshots_tmp

          # Baseline cadence: one composite JPEG per 6 seconds of source video.
          # Each composite is a 3x2 tile (3 columns wide, 2 rows tall,
          # 6 panels total), and the 6 panels come from six DIFFERENT
          # seconds within a 6-second window — one representative frame per
          # second, spread across the full 6-second span.
          #
          # fps=1 gives one frame per source second; tile=3x2 packs every 6
          # consecutive seconds into one JPEG; output image N covers source
          # seconds [N*6, N*6+6). Reading order inside each composite is
          # English reading order (left-to-right, then top-to-bottom).
          ffmpeg -y -i work/analysis/compressed.mp4 \
            -vf "fps=1,scale='min(640,iw)':'-2',tile=3x2:padding=2:margin=2:color=black" \
            -vsync vfr \
            -qscale:v 5 \
            -start_number 0 \
            "work/screenshots_tmp/grid_%05d.jpg"

          # Rename grid_<seq>.jpg -> frame_<window_start_seconds>.jpg
          # (zero-padded to 6 digits so files sort chronologically even for
          # long videos). Window start second = sequence index * 6.
          shopt -s nullglob
          for f in work/screenshots_tmp/grid_*.jpg; do
            base="$(basename "$f" .jpg)"       # e.g. grid_00042
            seq="${base#grid_}"                # e.g. 00042
            seq_num="$((10#$seq))"
            start_sec="$((seq_num * 6))"
            printf -v padded 'frame_%06d.jpg' "$start_sec"
            mv "$f" "work/screenshots/$padded"
          done
          rmdir work/screenshots_tmp || true

          count="$(ls work/screenshots | wc -l)"
          echo "SCREENSHOT_COUNT=$count" >> "$GITHUB_ENV"
          echo "SCREENSHOT_WINDOW_SECONDS=6" >> "$GITHUB_ENV"
          echo "Extracted $count baseline composite screenshots (6-second windows, 1 frame per second, 3x2 grid)"
          du -sh work/screenshots || true

      - name: Extract audio for transcription
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -i "$ORIGINAL_PATH" -vn -ac 1 -ar 16000 -c:a pcm_s16le work/audio.wav
          ls -lh work/audio.wav

      - name: Transcribe with faster-whisper (CPU)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/transcribe.py work/audio.wav work/transcript.json \
            --model "${{ github.event.inputs.whisper_model }}" \
            --lang "${{ github.event.inputs.language }}"
          head -c 400 work/transcript.json; echo

      # ---------------------------------------------------------------
      # Local vision-assist stack
      #
      # These steps replace what used to be pure "let the vision agent
      # figure it out" work. They run entirely on the runner using
      # ffmpeg, so they cost zero AI-vision tokens downstream while
      # dramatically improving scene detection.
      #
      # The stack is opt-out (enable_vision_assist=false) but ON by
      # default. If any step degrades, the scripts write empty-but-
      # valid indexes and the rest of the pipeline continues.
      #
      # NOTE: A local face-clustering ("character identification")
      # step used to live here. It was removed because its identity
      # errors (splits, merges, missed brief appearances) were doing
      # more harm than good. Character identification is now handled
      # directly by the downstream AI vision agent, which has both
      # the transcript and the screenshots to work from.
      # ---------------------------------------------------------------

      - name: Detect shot boundaries (scene_index.json)
        if: ${{ github.event.inputs.enable_vision_assist != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/scene_index.py \
            work/analysis/compressed.mp4 \
            "$DURATION_SECONDS" \
            work/scene_index.json \
            --threshold 0.35
          shot_count="$(python -c "import json; print(json.load(open('work/scene_index.json'))['shot_count'])")"
          echo "SHOT_COUNT=$shot_count" >> "$GITHUB_ENV"
          echo "Detected $shot_count shot(s)"

      - name: Build key-moments shortlist (key_moments.json)
        if: ${{ github.event.inputs.enable_vision_assist != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_key_moments.py \
            work/scene_index.json \
            work/transcript.json \
            work/key_moments.json \
            --max-moments 60
          km_count="$(python -c "import json; print(json.load(open('work/key_moments.json'))['moment_count'])")"
          echo "KEY_MOMENT_COUNT=$km_count" >> "$GITHUB_ENV"
          echo "Shortlisted $km_count key moment(s)"

      - name: Emit dense event composites for high-signal beats
        if: ${{ github.event.inputs.enable_vision_assist != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          # Count baseline images before we add event composites so we can
          # report the delta accurately.
          before="$(ls work/screenshots | grep -c '^frame_' || true)"

          python scripts/event_frames.py \
            work/analysis/compressed.mp4 \
            work/key_moments.json \
            work/screenshots \
            --window-seconds 4.0 \
            --samples 6 \
            --panel-width 640 \
            --max-events 30 \
            --min-priority 0.35

          # Count how many event composites landed.
          event_count="$(ls work/screenshots | grep -c '^event_' || true)"
          echo "EVENT_FRAME_COUNT=$event_count" >> "$GITHUB_ENV"
          echo "Wrote $event_count dense event composite(s) (baseline unchanged: $before)"

      - name: Vision-assist disabled — write empty stubs
        if: ${{ github.event.inputs.enable_vision_assist == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Vision-assist disabled by input; writing empty stub indexes."
          python -c "
          import json
          for path, extra in [
              ('work/scene_index.json', {'shot_count': 0, 'shots': []}),
              ('work/key_moments.json', {'moment_count': 0, 'moments': []}),
          ]:
              payload = {'video_duration_seconds': ${DURATION_SECONDS}}
              payload.update(extra)
              open(path, 'w').write(json.dumps(payload, indent=2))
          "
          echo "SHOT_COUNT=0" >> "$GITHUB_ENV"
          echo "KEY_MOMENT_COUNT=0" >> "$GITHUB_ENV"
          echo "EVENT_FRAME_COUNT=0" >> "$GITHUB_ENV"

      - name: Generate 00_READ_THIS_FIRST.txt (analysis prompt)
        shell: bash
        env:
          RAW_TARGET: ${{ github.event.inputs.target_duration_seconds }}
          # Pipe the optional focus string through the environment rather
          # than interpolating it into the shell command line — the value
          # is free-form user text that can contain quotes, backticks,
          # newlines, or `$` characters and would otherwise be a shell
          # injection footgun.
          FOCUS_INPUT: ${{ github.event.inputs.focus }}
        run: |
          set -euo pipefail
          # Sanitize user-supplied target duration; fall back to 120s if
          # the input is missing or non-numeric / non-positive.
          raw="${RAW_TARGET:-}"
          raw="${raw// /}"
          if [[ "$raw" =~ ^[0-9]+$ ]] && [ "$raw" -gt 0 ]; then
            target_dur="$raw"
          else
            target_dur="120"
          fi
          echo "Target output duration (seconds): $target_dur"

          # Normalize the optional focus value. Treat missing / all-whitespace
          # as "no focus" (whole-video mode). When a focus is provided,
          # log it verbatim so it's easy to correlate with the generated
          # prompt in workflow logs.
          focus_trimmed="$(printf '%s' "${FOCUS_INPUT:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -n "$focus_trimmed" ]; then
            echo "Focus (narrow analysis to): $focus_trimmed"
          else
            echo "Focus: (none — whole video considered)"
          fi

          # Pass the focus value via env into the generator so we don't
          # have to worry about shell-quoting a multi-line / special-char
          # user string on the argv command line.
          FOCUS="$focus_trimmed" \
          python scripts/generate_analysis_prompt.py \
            "$DURATION_SECONDS" "$SCREENSHOT_COUNT" \
            "work/00_READ_THIS_FIRST.txt" \
            --target-duration "$target_dur" \
            --job-id "${{ steps.jid.outputs.job_id }}" \
            --window-seconds "${SCREENSHOT_WINDOW_SECONDS:-6}" \
            --shot-count "${SHOT_COUNT:-0}" \
            --key-moment-count "${KEY_MOMENT_COUNT:-0}" \
            --event-frame-count "${EVENT_FRAME_COUNT:-0}" \
            --focus-env FOCUS
          head -n 60 work/00_READ_THIS_FIRST.txt

      - name: Zip screenshots (baseline + event composites)
        shell: bash
        run: |
          set -euo pipefail
          cd work
          (cd screenshots && zip -q -r ../screenshots.zip .)
          ls -lh screenshots.zip

      - name: Stash ORIGINAL video for Stage B (uploaded as private release asset)
        shell: bash
        run: |
          set -euo pipefail
          orig_name="original$(echo "$ORIGINAL_PATH" | sed 's/.*\././')"
          mkdir -p work/stash
          cp "$ORIGINAL_PATH" "work/stash/$orig_name"
          echo "ORIGINAL_ASSET_NAME=$orig_name" >> "$GITHUB_ENV"
          ls -lh "work/stash/$orig_name"

      - name: Create GitHub Release with analysis bundle
        id: rel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.jid.outputs.release_tag }}
          name: "ClipForge job ${{ steps.jid.outputs.job_id }}"
          body: |
            ClipForge Stage A output.

            clipforge-job-id: ${{ steps.jid.outputs.job_id }}
            created_at_epoch: ${{ github.run_id }}
            stage: awaiting_json_upload

            Assets:
              - 00_READ_THIS_FIRST.txt   (READ FIRST — cut selection instructions)
              - transcript.json          (timestamped transcript)
              - scene_index.json         (locally-computed shot boundaries)
              - key_moments.json         (locally-ranked shortlist of high-signal moments)
              - screenshots.zip          (baseline 6s composites + dense event composites)
              - ${{ env.ORIGINAL_ASSET_NAME }}   (original quality video, used by Stage B)

            Stats:
              shots detected:           ${{ env.SHOT_COUNT }}
              key moments shortlisted:  ${{ env.KEY_MOMENT_COUNT }}
              baseline composites:      ${{ env.SCREENSHOT_COUNT }}
              dense event composites:   ${{ env.EVENT_FRAME_COUNT }}

            This release is automatically deleted 12 hours after creation.
          make_latest: "false"
          prerelease: true
          files: |
            work/00_READ_THIS_FIRST.txt
            work/transcript.json
            work/scene_index.json
            work/key_moments.json
            work/screenshots.zip
            work/stash/${{ env.ORIGINAL_ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release asset URLs
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.jid.outputs.release_tag }}"
          repo="${GITHUB_REPOSITORY}"
          json="$(gh api "repos/${repo}/releases/tags/${tag}")"
          echo "$json" | python -c '
          import json, os, sys
          data = json.load(sys.stdin)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("release_url=" + data.get("html_url", "") + "\n")
          out = {}
          for a in data.get("assets", []):
              out[a["name"]] = a["browser_download_url"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in out.items():
                  # sanitize key for GH output
                  key = "asset_" + "".join(c if c.isalnum() else "_" for c in k)
                  f.write(f"{key}={v}\n")
              f.write("assets_json=" + json.dumps(out) + "\n")
          '

      - name: Write awaiting_json_upload status
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_status.py "${{ steps.jid.outputs.job_id }}" "awaiting_json_upload" \
            --message "Stage A complete. Open the Release, hand it to your agent, then upload production.json to start Stage B." \
            --release-tag "${{ steps.jid.outputs.release_tag }}" \
            --release-url "${{ steps.assets.outputs.release_url }}" \
            --extra "duration_seconds=${DURATION_SECONDS}" \
            --extra "screenshot_count=${SCREENSHOT_COUNT}" \
            --extra "event_frame_count=${EVENT_FRAME_COUNT:-0}" \
            --extra "shot_count=${SHOT_COUNT:-0}" \
            --extra "key_moment_count=${KEY_MOMENT_COUNT:-0}" \
            --extra "original_asset_name=${ORIGINAL_ASSET_NAME}"

          # Merge in every asset URL from the release.
          python - <<'PY'
          import json, os
          from pathlib import Path
          jid = os.environ["JID"]
          assets = json.loads(os.environ["ASSETS_JSON"])
          p = Path(f"jobs/{jid}/status.json")
          data = json.loads(p.read_text())
          data.setdefault("assets", {}).update(assets)
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False))
          PY
        env:
          JID: ${{ steps.jid.outputs.job_id }}
          ASSETS_JSON: ${{ steps.assets.outputs.assets_json }}

      - name: Commit final status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ steps.jid.outputs.job_id }}/status.json"
          git commit -m "clipforge: job ${{ steps.jid.outputs.job_id }} awaiting production.json" || echo "nothing to commit"
          git push

      - name: On failure, write error status
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_status.py "${{ steps.jid.outputs.job_id }}" "error" \
            --message "Stage A failed. See workflow run for logs." \
            --release-tag "${{ steps.jid.outputs.release_tag }}" || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ steps.jid.outputs.job_id }}/status.json" || true
          git commit -m "clipforge: job ${{ steps.jid.outputs.job_id }} error" || true
          git push || true
