name: Stage B — Render Final Video (voiceover + captions, one merged MP4)

# Keyed by job id so a run is easy to identify and concurrent jobs never
# confuse each other's status.
run-name: Stage B — ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (must match an existing Stage A release: clipforge-<job_id>)"
        required: true
        type: string
      production_ref:
        description: "Where production.json lives. One of: path:<repo-path> | asset:<asset-name> | url:<https-url>"
        required: true
        type: string
        default: "path:jobs/<JOB_ID>/production.json"
      music_ref:
        description: "Optional background music for this job. Empty = no music. One of: path:<repo-path> | asset:<asset-name> | url:<https-url>"
        required: false
        type: string
        default: ""
      enhance:
        description: "Apply the tuned quality enhancement filter chain (denoise + color grade + sharpen) to the merged video. Default true."
        required: false
        type: string
        default: "true"
      code_ref:
        description: "Optional current default-branch SHA to check out and run THIS Stage B execution from. Every start/restart dispatch passes the freshly resolved tip so a failed job never reuses stale code. Empty = current default branch."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: clipforge-stage-b-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  stage_b:
    name: Stage B
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # ---------------------------------------------------------------------
      # RESTART CORRECTNESS — always run the NEWEST code on a restart.
      # A restart is a fresh workflow_dispatch pinned to the CURRENT default-
      # branch tip SHA (passed as `code_ref`), never a GitHub "re-run" (which
      # would pin the ORIGINAL run's commit). Empty input falls back to the
      # repository's current default branch.
      # ---------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.code_ref != '' && github.event.inputs.code_ref || github.event.repository.default_branch }}

      - name: Log the exact code revision this run is executing
        shell: bash
        run: |
          set -euo pipefail
          echo "dispatch ref (github.ref)     : ${{ github.ref }}"
          echo "dispatch sha (github.sha)     : ${{ github.sha }}"
          echo "code_ref input (current pin)  : ${{ github.event.inputs.code_ref }}"
          echo "checked-out commit (HEAD)     : $(git rev-parse HEAD)"
          echo "checked-out commit subject    : $(git log -1 --pretty=%s)"

      # ---------------------------------------------------------------------
      # STATUS-PUBLISH CORRECTNESS — never run the status-commit steps from a
      # detached HEAD. A SHA-pinned checkout (code_ref restart) is re-attached
      # to the dispatch branch AT THE SAME COMMIT (no content change) so the
      # status steps below can commit and push.
      # ---------------------------------------------------------------------
      - name: Re-attach HEAD to the dispatch branch when the checkout pinned a SHA
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git symbolic-ref -q HEAD > /dev/null; then
            echo "HEAD is on branch '$(git symbolic-ref --short HEAD)' — nothing to do."
            exit 0
          fi
          branch="${DEFAULT_BRANCH:?repository default branch is required}"
          echo "HEAD is detached at $(git rev-parse HEAD) (code_ref-pinned restart checkout)."
          echo "Re-attaching branch '$branch' at this exact commit so status commits can be pushed."
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          git checkout -B "$branch" HEAD
          git branch --set-upstream-to="origin/$branch" "$branch"
          echo "Now on branch '$branch' at $(git rev-parse HEAD)."

      - name: Resolve inputs
        id: jid
        shell: bash
        run: |
          set -euo pipefail
          jid="${{ github.event.inputs.job_id }}"
          jid="$(echo "$jid" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')"
          if [ -z "$jid" ]; then echo "job_id resolved to empty string" >&2; exit 1; fi
          echo "job_id=$jid" >> "$GITHUB_OUTPUT"
          echo "release_tag=clipforge-$jid" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Python deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          pip install -r pipeline/requirements.txt

      # ---------------------------------------------------------------------
      # STATUS: stage_b_running. Written BEFORE any risky work so a crashed
      # run always leaves a resumable record (ARCHITECTURE.md §6.2).
      #
      # RESTART NOTE: the job state machine refuses to leave a terminal state
      # (complete/error/cancelled) for a non-terminal one. A Stage B restart
      # is a deliberate operator/bot action that SUPERSEDES the prior run's
      # terminal record, so when the existing status is terminal we archive it
      # inline (message + prior_state) and start a fresh status file for this
      # run. This is the only place that reset is permitted.
      # ---------------------------------------------------------------------
      - name: Write stage_b_running status
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          JID="${{ steps.jid.outputs.job_id }}"
          STATUS_FILE="jobs/$JID/status.json"
          mkdir -p "jobs/$JID"
          if [ -f "$STATUS_FILE" ]; then
            PRIOR_STATE="$(python -c "import json; print(json.load(open('$STATUS_FILE')).get('state',''))" || true)"
            case "$PRIOR_STATE" in
              complete|error|cancelled)
                echo "Prior status is terminal ($PRIOR_STATE); archiving it for this Stage B restart."
                mv "$STATUS_FILE" "jobs/$JID/status.superseded-$PRIOR_STATE.$(date +%s).json"
                ;;
            esac
          fi
          python -m pipeline.status "$JID" --state stage_b_running \
            --message "Stage B started: producing final video (voiceover, music, captions)" \
            --release-tag "${{ steps.jid.outputs.release_tag }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --code-ref "$(git rev-parse HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/$JID/"
          git commit -m "clipforge: job $JID stage B running" || echo "nothing to commit"
          pushed=false
          for attempt in 1 2 3; do
            if git push; then pushed=true; break; fi
            echo "stage_b_running status push attempt $attempt failed — rebasing and retrying…" >&2
            git pull --rebase --autostash || true
            sleep 2
          done
          if [ "$pushed" != "true" ]; then
            echo "WARN: stage_b_running status push failed after 3 attempts; the final status commit will carry it." >&2
          fi

      # ---------------------------------------------------------------------
      # bug-20: GitHub's /releases/tags/<tag> endpoint is eventually consistent
      # relative to a very-recent asset upload. When Stage A dispatches Stage B
      # via workflow_dispatch immediately after publishing the release, the
      # first API read here can return the release WITHOUT the source video
      # asset yet visible (or with an asset entry whose upload state is not
      # "uploaded"), even though softprops/action-gh-release@v2 has already
      # completed the upload from the runner's side. Additionally an asset
      # entry can appear in "starter" state momentarily after creation. We
      # poll with bounded exponential backoff until source_input.bin (or the
      # legacy original.* fallback) is present AND its state is "uploaded",
      # then hand its id + name to the download step. This is a genuine
      # eventual-consistency race, so a bounded retry IS the correct fix.
      # ---------------------------------------------------------------------
      - name: Load release metadata (find source video asset)
        id: relmeta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.jid.outputs.release_tag }}
        run: |
          set -euo pipefail
          # Bounded polling: up to ~90s total wall time (attempts at
          # 0, 3, 6, 10, 15, 20, 30 seconds cumulative). Enough for the
          # observed GitHub eventual-consistency lag on release-asset reads
          # (single-digit seconds in practice), without stalling a real
          # "release/asset genuinely missing" failure for too long.
          delays=(0 3 3 4 5 5 10 15 20 25)
          attempt=0
          release_url=""
          orig_name=""
          orig_id=""
          for delay in "${delays[@]}"; do
            attempt=$((attempt + 1))
            if [ "$delay" -gt 0 ]; then
              echo "Waiting ${delay}s before release-metadata retry #${attempt}..."
              sleep "$delay"
            fi
            if ! json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)"; then
              echo "Attempt ${attempt}: release ${RELEASE_TAG} not readable yet (API returned non-zero)."
              continue
            fi
            echo "$json" > work_release.json
            # Parse the release and choose the source asset. Only accept an
            # asset whose upload state is "uploaded" — GitHub briefly reports
            # assets in states like "starter" or "new" while the upload is
            # still finalizing, and downloading those returns a truncated or
            # empty body without a hard HTTP error.
            parsed="$(python - <<'PY'
          import json, os
          with open("work_release.json", encoding="utf-8") as fh:
              data = json.load(fh)
          assets = data.get("assets") or []
          def is_ready(asset):
              state = (asset.get("state") or "").lower()
              # Older API responses sometimes omit state entirely; treat that
              # as ready to preserve behavior on releases that predate the
              # field being surfaced.
              return state in ("", "uploaded")
          pick = None
          for a in assets:
              if a.get("name") == "source_input.bin" and is_ready(a):
                  pick = a
                  break
          if pick is None:
              for a in assets:
                  name = a.get("name") or ""
                  if name.startswith("original.") and is_ready(a):
                      pick = a
                      break
          summary = {
              "html_url": data.get("html_url") or "",
              "asset_count": len(assets),
              "asset_names": [a.get("name") for a in assets],
              "asset_states": {a.get("name"): (a.get("state") or "") for a in assets},
          }
          if pick is not None:
              summary["orig_name"] = pick.get("name") or ""
              summary["orig_id"] = pick.get("id") or ""
          print(json.dumps(summary))
          PY
          )"
            release_url="$(python -c "import json,sys; print(json.loads(sys.argv[1]).get('html_url',''))" "$parsed")"
            orig_name="$(python -c "import json,sys; print(json.loads(sys.argv[1]).get('orig_name',''))" "$parsed")"
            orig_id="$(python -c "import json,sys; print(json.loads(sys.argv[1]).get('orig_id',''))" "$parsed")"
            asset_count="$(python -c "import json,sys; print(json.loads(sys.argv[1]).get('asset_count',0))" "$parsed")"
            asset_names="$(python -c "import json,sys; print(', '.join([n for n in json.loads(sys.argv[1]).get('asset_names',[]) if n]))" "$parsed")"
            echo "Attempt ${attempt}: release ${RELEASE_TAG} has ${asset_count} asset(s) visible: [${asset_names}]"
            if [ -n "$orig_id" ] && [ -n "$orig_name" ]; then
              echo "Attempt ${attempt}: found ready source asset '${orig_name}' (id=${orig_id})."
              break
            fi
            echo "Attempt ${attempt}: source asset not yet visible/ready."
          done
          if [ -z "$orig_id" ] || [ -z "$orig_name" ]; then
            echo "Could not find the source video asset (source_input.bin / original.*) in release ${RELEASE_TAG} after ${attempt} attempts. Final visible assets: [${asset_names:-none}]" >&2
            exit 1
          fi
          {
            echo "release_url=${release_url}"
            echo "orig_name=${orig_name}"
            echo "orig_id=${orig_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Download source video from release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work
          orig_id="${{ steps.relmeta.outputs.orig_id }}"
          orig_name="${{ steps.relmeta.outputs.orig_name }}"
          if [ -z "$orig_id" ] || [ -z "$orig_name" ]; then
            # Belt-and-suspenders: relmeta guarantees these are set, but keep
            # the guard so an accidentally-empty output surfaces cleanly.
            echo "Could not find the source video asset (source_input.bin / original.*) in release ${{ steps.jid.outputs.release_tag }}" >&2
            exit 1
          fi
          # Small download retry loop for transient 5xx / connection resets on
          # the asset download endpoint (unrelated to the metadata race above,
          # but observed occasionally on large release assets).
          for attempt in 1 2 3; do
            if gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${orig_id}" \
                > "work/${orig_name}"; then
              break
            fi
            echo "Asset download attempt ${attempt} failed — retrying..." >&2
            rm -f "work/${orig_name}"
            sleep $((attempt * 3))
          done
          if [ ! -s "work/${orig_name}" ]; then
            echo "Asset download produced an empty file for ${orig_name} after 3 attempts." >&2
            exit 1
          fi
          ls -lh "work/${orig_name}"
          echo "ORIGINAL_PATH=work/${orig_name}" >> "$GITHUB_ENV"

      - name: Resolve production.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.production_ref }}"
          jid="${{ steps.jid.outputs.job_id }}"
          ref="${ref//<JOB_ID>/$jid}"

          case "$ref" in
            path:*)
              src="${ref#path:}"
              if [ ! -f "$src" ]; then
                echo "production.json not found at repo path: $src" >&2
                exit 1
              fi
              cp "$src" work/production.json
              ;;
            url:*)
              src="${ref#url:}"
              curl -fSL --retry 3 -o work/production.json "$src"
              ;;
            asset:*)
              name="${ref#asset:}"
              tag="${{ steps.jid.outputs.release_tag }}"
              aid="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                    --jq ".assets[] | select(.name==\"$name\") | .id")"
              if [ -z "$aid" ]; then
                echo "asset not found: $name" >&2; exit 1
              fi
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" \
                > work/production.json
              ;;
            *)
              echo "Unknown production_ref format: $ref" >&2; exit 1;;
          esac

          echo "production.json head:"
          head -c 400 work/production.json; echo

          # BOUNDARY VALIDATION (§13 invariant #5): the plan is untrusted even
          # though the bot validated it at upload. This runs the single source
          # of truth validator AND the Series cross-check against the durable
          # Stage A request before any render work begins.
          JID="$jid" PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import json, os, sys
          from pathlib import Path
          from pipeline.plan.schema import validate_production_plan
          from pipeline.stage_b.common import normalize_plan

          jid = os.environ["JID"]
          plan = json.loads(Path("work/production.json").read_text(encoding="utf-8"))
          errors = validate_production_plan(plan)

          # Series cross-check: when the durable Stage A request says this job
          # is a series part, the plan must carry matching boundary metadata.
          request_path = Path("jobs") / jid / "stage-a-request.json"
          if request_path.exists():
              try:
                  request = json.loads(request_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  request = {}
              series_req = request.get("series") or {}
              if isinstance(series_req, dict) and series_req.get("enabled"):
                  normalized = normalize_plan(plan)
                  plan_series = normalized.get("series") or {}
                  expected = {
                      "series_id": series_req.get("series_id"),
                      "part": int(series_req.get("part") or 0),
                      "start_seconds": int(series_req.get("start_seconds") or 0),
                  }
                  actual = {
                      "series_id": plan_series.get("series_id"),
                      "part": int(plan_series.get("part") or 0),
                      "start_seconds": int(plan_series.get("start_seconds") or 0),
                  }
                  for key, value in expected.items():
                      if actual.get(key) != value:
                          errors.append(
                              f"Series metadata mismatch for {key}: expected {value!r}, got {actual.get(key)!r}."
                          )
          if errors:
              sys.stderr.write("Invalid production.json:\n- " + "\n- ".join(errors) + "\n")
              raise SystemExit(1)
          print("production.json passed the Stage B boundary validation.")
          PY

      - name: Resolve optional background music
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.music_ref }}"
          jid="${{ steps.jid.outputs.job_id }}"
          if [ -z "$ref" ]; then
            echo "No music_ref supplied — final video ships without background music."
            exit 0
          fi
          ref="${ref//<JOB_ID>/$jid}"
          case "$ref" in
            path:*)
              src="${ref#path:}"
              if [ ! -f "$src" ]; then
                echo "music file not found at repo path: $src" >&2
                exit 1
              fi
              cp "$src" work/music_input
              ;;
            url:*)
              src="${ref#url:}"
              curl -fSL --retry 3 -o work/music_input "$src"
              ;;
            asset:*)
              name="${ref#asset:}"
              tag="${{ steps.jid.outputs.release_tag }}"
              aid="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                    --jq ".assets[] | select(.name==\"$name\") | .id")"
              if [ -z "$aid" ]; then
                echo "music asset not found: $name" >&2; exit 1
              fi
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" \
                > work/music_input
              ;;
            *)
              echo "Unknown music_ref format: $ref" >&2; exit 1;;
          esac
          ls -lh work/music_input
          echo "MUSIC_PATH=work/music_input" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # THE RENDER. One module invocation runs the whole chain —
      #   validate → voiceover → render/merge → enhance → captions →
      #   watermark → compress → package
      # and writes jobs/<job_id>/status.json before/after each risky step.
      # ---------------------------------------------------------------------
      - name: Run the Stage B pipeline
        shell: bash
        env:
          ENHANCE_FLAG: ${{ github.event.inputs.enhance }}
          MUSIC_PATH: ${{ env.MUSIC_PATH }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export GITHUB_WORKFLOW_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          ENHANCE_ARG="--enhance"
          case "${ENHANCE_FLAG:-true}" in
            true|1|yes|on|True|TRUE)  ENHANCE_ARG="--enhance" ;;
            false|0|no|off|False|FALSE) ENHANCE_ARG="--no-enhance" ;;
            *) echo "Unrecognised enhance flag: '${ENHANCE_FLAG}' — defaulting to enabled." >&2 ;;
          esac

          MUSIC_ARGS=()
          if [ -n "${MUSIC_PATH:-}" ]; then
            MUSIC_ARGS=(--music "$MUSIC_PATH")
          fi

          python -m pipeline.stage_b.run \
            --job-id "${{ steps.jid.outputs.job_id }}" \
            --production-json work/production.json \
            --original-video "$ORIGINAL_PATH" \
            --work-dir work \
            --release-tag "${{ steps.jid.outputs.release_tag }}" \
            --release-url "${{ steps.relmeta.outputs.release_url }}" \
            $ENHANCE_ARG \
            "${MUSIC_ARGS[@]}"

          ls -lh work/out/

      # ---------------------------------------------------------------------
      # NOTE: the source_input.bin release asset is intentionally NOT deleted.
      # It is the ONLY input a Stage B restart has to work with (the runner
      # filesystem is ephemeral and there is no committed copy of the source).
      # The hourly cleanup workflow removes the whole release at job expiry.
      # ---------------------------------------------------------------------

      - name: Upload final zip + the finished video to the SAME release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.jid.outputs.release_tag }}
          name: "ClipForge job ${{ steps.jid.outputs.job_id }}"
          body: |
            ClipForge output.

            clipforge-job-id: ${{ steps.jid.outputs.job_id }}
            stage: complete

            Final artifacts (ONE finished, ready-to-post video + posting package):
              - final.mp4 — the merged vertical video: all cuts concatenated,
                voiceover mixed in (source audio muted), cinematic captions and
                title banner burned in, optional background music ducked under
                the voiceover when one was supplied.
              - metadata.txt — title, hashtags, and YouTube tags sourced
                verbatim from production.json.
              - clipforge-${{ steps.jid.outputs.job_id }}-final.zip
                (contains final.mp4 + metadata.txt + production.json)

            This release is automatically deleted when the job expires.
          make_latest: "false"
          prerelease: true
          files: |
            work/out/clipforge-${{ steps.jid.outputs.job_id }}-final.zip
            work/out/final.mp4
            work/out/metadata.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve final asset URLs
        id: finalasset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.jid.outputs.release_tag }}"
          url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                --jq ".assets[] | select(.name | endswith(\"-final.zip\")) | .browser_download_url")"
          echo "final_url=$url" >> "$GITHUB_OUTPUT"
          mp4="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                --jq ".assets[] | select(.name == \"final.mp4\") | .browser_download_url")"
          echo "final_mp4_url=$mp4" >> "$GITHUB_OUTPUT"

      - name: Write complete status
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          JID="${{ steps.jid.outputs.job_id }}"
          python -m pipeline.status "$JID" --state complete \
            --message "Final video is ready (one merged MP4 with voiceover and cinematic captions)." \
            --release-tag "${{ steps.jid.outputs.release_tag }}" \
            --release-url "${{ steps.relmeta.outputs.release_url }}" \
            --asset "final_zip=${{ steps.finalasset.outputs.final_url }}" \
            --asset "final_mp4=${{ steps.finalasset.outputs.final_mp4_url }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --code-ref "$(git rev-parse HEAD)"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/$JID/status.json"
          git commit -m "clipforge: job $JID complete" || echo "nothing to commit"
          # Persisting the complete status is a HARD requirement — rebase onto
          # the latest branch tip and retry; only fail loudly if the status
          # truly cannot be persisted.
          pushed=false
          for attempt in 1 2 3; do
            if git push; then pushed=true; break; fi
            echo "status push attempt $attempt failed — rebasing onto latest origin and retrying…" >&2
            git pull --rebase --autostash
            sleep 2
          done
          if [ "$pushed" != "true" ]; then
            echo "FATAL: could not persist the complete status to origin after 3 attempts." >&2
            exit 1
          fi

      # ---------------------------------------------------------------------
      # SERIES CONTINUATION (§11, automatic mode) — derive the next part from
      # persisted series state, commit its stage-a-request.json + queued
      # status.json, and dispatch Stage A for it. Manual-mode series parts are
      # chained by the bot's "Start next part" action instead.
      # ---------------------------------------------------------------------
      - name: Continue the next validated Series Mode part
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ steps.jid.outputs.job_id }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          test -f "jobs/$JOB_ID/production.json" || exit 0
          test -f "jobs/$JOB_ID/stage-a-request.json" || exit 0
          # Manual series parts chain via the bot's "Start next part" button.
          if [ "$(python -c "import json;print(json.load(open('jobs/$JOB_ID/stage-a-request.json')).get('mode'))")" != "automatic" ]; then
            echo "Manual series part — continuation is started from the bot; nothing to do."
            exit 0
          fi
          mkdir -p work
          python -m pipeline.plan.series . "$JOB_ID" > work/series_next.json
          python - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path

          payload = json.load(open("work/series_next.json", encoding="utf-8"))
          if not payload.get("continue"):
              print("Series is not enabled or this was the final part; no continuation dispatched.")
              raise SystemExit(0)

          next_id = str(payload.get("job_id") or "")
          request_body = payload.get("request") or {}
          series = request_body.get("series") or {}
          required = {
              "job_id": next_id,
              "series_id": series.get("series_id"),
              "series.source_job_id": series.get("source_job_id"),
          }
          if any(not str(v or "").strip() for v in required.values()):
              raise SystemExit("Series continuation payload is incomplete.")
          if not isinstance(series.get("part"), int) or series["part"] < 1:
              raise SystemExit("Series continuation payload has an invalid part.")
          if not isinstance(series.get("start_seconds"), int) or series["start_seconds"] < 0:
              raise SystemExit("Series continuation payload has an invalid start_seconds.")

          # Duplicate-dispatch guard, mirroring the legacy request_path.exists() check.
          if (Path("jobs") / next_id / "stage-a-request.json").exists() or (Path("jobs") / next_id / "status.json").exists():
              print(f"Series continuation {next_id} was already persisted; skipping duplicate dispatch.")
              raise SystemExit(0)

          document = {
              "version": 2,
              "job_id": next_id,
              **request_body,
              "saved_at_epoch": int(time.time()),
          }
          request_path = Path("jobs") / next_id / "stage-a-request.json"
          request_path.parent.mkdir(parents=True, exist_ok=True)
          request_path.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")

          status = {
              "version": 2,
              "job_id": next_id,
              "mode": document.get("mode") if document.get("mode") in ("manual", "automatic") else "automatic",
              "series": {
                  "enabled": True,
                  "series_id": series["series_id"],
                  "part": series["part"],
                  "start_seconds": series["start_seconds"],
                  "is_final": False,
              },
              "state": "queued",
              "message": f"Series part {series['part']} queued by automatic continuation.",
              "created_at_epoch": int(time.time()),
              "updated_at_epoch": int(time.time()),
              "expires_at_epoch": int(time.time()) + 12 * 3600,
              "release_tag": f"clipforge-{next_id}",
              "release_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/clipforge-{next_id}",
              "assets": {},
              # job_status.schema.json requires all three keys when `run` is present
              # (same empty defaults the bot's newStatus uses before a run exists).
              "run": {"workflow_run_id": 0, "workflow_run_url": "", "code_ref": ""},
              "publishing": {"status": "not_requested", "posts": [], "idempotency_key": ""},
          }
          status_path = Path("jobs") / next_id / "status.json"
          status_path.write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "pull", "--rebase", "--autostash"], check=True)
          subprocess.run(["git", "add", str(request_path), str(status_path)], check=True)
          subprocess.run(["git", "commit", "-m", f"clipforge: queue series part {series['part']} ({next_id})"], check=True)
          pushed = False
          for attempt in (1, 2, 3):
              result = subprocess.run(["git", "push"])
              if result.returncode == 0:
                  pushed = True
                  break
              print(f"continuation push attempt {attempt} failed — rebasing and retrying…", flush=True)
              subprocess.run(["git", "pull", "--rebase", "--autostash"], check=True)
              time.sleep(2)
          if not pushed:
              raise SystemExit("FATAL: could not persist the series continuation after 3 attempts.")

          # The new stage-a.yml's only inputs are job_id + code_ref; everything
          # else is read back from the persisted request document (§7.1).
          code_ref = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip()
          subprocess.run([
              "gh", "workflow", "run", "stage-a.yml",
              "--repo", os.environ["GITHUB_REPOSITORY"],
              "--ref", os.environ.get("GITHUB_REF_NAME", "main"),
              "-f", f"job_id={next_id}",
              "-f", f"code_ref={code_ref}",
          ], check=True)
          print(f"Dispatched Series Mode Part {series['part']} as {next_id}.")
          PY

      # ---------------------------------------------------------------------
      # AUTOMATIC PUBLISH (§11 "optional auto-Publish") — when the clone's
      # branding/zernio_settings.json enables auto_publish and at least one
      # selected target account is still active, dispatch publish.yml
      # action=publish for the just-completed job. Publishing is metadata on a
      # complete job (§6.1/§6.2), so this step is ALWAYS a no-op success when
      # any gate fails — it can never fail a completed Stage B run, and the
      # job state never leaves `complete`. The idempotency key mirrors the
      # bot's zernioRequestId reuse-on-failure rule so a re-render recovers
      # the same logical publish instead of double-posting.
      # ---------------------------------------------------------------------
      - name: Dispatch automatic Zernio publish when enabled
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ steps.jid.outputs.job_id }}
          ZERNIO_SECRET_PRESENT: ${{ secrets.ZERNIO_API_KEY != '' }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          # bug-24: the working tree is pinned to the job's code_ref (the SHA
          # captured when the job STARTED). If the operator toggled
          # auto_publish in Settings after the job started, the local
          # branding/zernio_settings.json is STALE and the gate below reads
          # the old "off" value — the publish step is then skipped even though
          # automatic publish is enabled. Pull the CURRENT tip of the default
          # branch so the settings read reflects the latest committed config.
          # Status commits already happened above, so this can never clobber
          # pending work; it only advances the checkout.
          git fetch origin "${{ github.event.repository.default_branch }}" --depth=1 || true
          git checkout "origin/${{ github.event.repository.default_branch }}" -- branding/ 2>/dev/null || true
          IFS=$'\t' read -r DISPATCH MODE TIMEZONE TARGETS_JSON REQUEST_ID REASON < <(
            python -m pipeline.publish.zernio automatic-dispatch . "$JOB_ID" \
              --secret-configured "$ZERNIO_SECRET_PRESENT"
          )
          echo "Zernio automatic publish gate: $REASON"
          if [ "$DISPATCH" != "true" ]; then
            echo "Automatic publish not armed — nothing to do."
            exit 0
          fi
          branch="${{ github.event.repository.default_branch }}"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
            -f "action=publish" \
            -f "job_id=$JOB_ID" \
            -f "mode=$MODE" \
            -f "timezone=$TIMEZONE" \
            -f "targets_json=$TARGETS_JSON" \
            -f "request_id=$REQUEST_ID"
          echo "Dispatched publish.yml action=publish for $JOB_ID (mode=$MODE, request_id=$REQUEST_ID)."

      - name: On failure, write error status
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          JID="${{ steps.jid.outputs.job_id }}"
          # The pipeline already writes a precise error status when it fails in
          # a known way; this CLI write covers catastrophic failures (checkout,
          # dependency install, runner kill) where the pipeline never ran. A
          # terminal -> terminal write is idempotent, so this never clobbers a
          # more precise error with a generic one.
          python -m pipeline.status "$JID" --state error \
            --message "Stage B failed. See workflow run for logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --release-tag "${{ steps.jid.outputs.release_tag }}" || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/$JID/status.json" || true
          git commit -m "clipforge: job $JID error (stage B)" || true
          pushed=false
          for attempt in 1 2 3; do
            if git push; then pushed=true; break; fi
            git pull --rebase --autostash || true
            sleep 2
          done
          true

  stage_b_cancelled:
    name: Record Stage B cancellation
    needs: stage_b
    if: ${{ cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure HEAD is on a branch
        shell: bash
        run: |
          set -euo pipefail
          if git symbolic-ref -q HEAD > /dev/null; then
            echo "HEAD is on branch '$(git symbolic-ref --short HEAD)' — nothing to do."
            exit 0
          fi
          branch="${GITHUB_REF#refs/heads/}"
          if [ "$branch" = "$GITHUB_REF" ] || [ -z "$branch" ]; then
            branch="main"
          fi
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          git checkout -B "$branch" HEAD
          git branch --set-upstream-to="origin/$branch" "$branch"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Write cancelled status
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          jid="${{ github.event.inputs.job_id }}"
          jid="$(echo "$jid" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')"
          python -m pipeline.status "$jid" --state cancelled \
            --message "Stage B was cancelled." \
            --release-tag "clipforge-$jid" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/$jid/status.json"
          git commit -m "clipforge: job $jid stage B cancelled" || echo "nothing to commit"
          pushed=false
          for attempt in 1 2 3; do
            if git push; then pushed=true; break; fi
            git pull --rebase --autostash || true
            sleep 2
          done
          true
