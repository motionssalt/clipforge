name: Stage A — Ingest, Transcribe, Analyze (new pipeline)

# New-architecture Stage A. Driven by jobs/<job_id>/stage-a-request.json
# (written by the bot before dispatch — ARCHITECTURE.md §7.1), NOT by a wall
# of workflow inputs. Writes jobs/<job_id>/status.json via pipeline/status.py
# before and after every risky step. Publishes the §7.2 analysis bundle to
# release clipforge-<job_id>.
#
# Preserved subsystem §9.1 (telegram_channel) is wired: ingest.py routes it to
# pipeline/stage_a/telegram_channel.py, which enforces the original-repo gate
# plus fail-closed MTProto secrets (absent on clones — that absence IS the
# security boundary's second layer). telegram_relay §9.2 fetches its temporary
# prerelease asset through the same GH_TOKEN the release-URL steps already use.
#
# bug-30: the Gemini-based Automatic Mode (production.json generation) is
# removed. Stage A always ends in awaiting_plan; the only path into Stage B is
# a user-supplied production.json (file upload, paste, or the agent prompt).
run-name: Stage A — ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (must have jobs/<job_id>/stage-a-request.json committed by the bot)"
        required: true
        type: string
      code_ref:
        description: "Optional current default-branch SHA to run THIS execution from (restart-correctness). Empty = current default branch."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: clipforge-stage-a-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  stage_a:
    name: Stage A
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # RESTART CORRECTNESS — a restart pins the CURRENT default-branch tip,
      # never the original run's commit (mirrors stage-b.yml).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.code_ref != '' && inputs.code_ref || github.event.repository.default_branch }}

      - name: Re-attach HEAD to the dispatch branch when the checkout pinned a SHA
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git symbolic-ref -q HEAD > /dev/null; then exit 0; fi
          branch="${DEFAULT_BRANCH:?}"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          git checkout -B "$branch" HEAD
          git branch --set-upstream-to="origin/$branch" "$branch"

      # ---------------------------------------------------------------------
      # bug-42: RELAY BACK TO THE BOT FIRST. This is the literal first piece
      # of work after checkout — before Python setup, dependency install, or
      # any processing. The bot polls jobs/<id>/status.json; pushing a
      # stage_a_running marker here means the bot learns the run actually
      # started immediately, not after several heavy steps. pipeline/status.py
      # is stdlib-only and needs no setup. Failure here must NOT fail the run
      # (the existing status step later still fires) — hence continue-on-error.
      # ---------------------------------------------------------------------
      - name: Notify bot that the run started (first step)
        id: notify_start
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          job_id="${{ inputs.job_id }}"
          if ! [[ "$job_id" =~ ^[A-Za-z0-9._-]{1,120}$ ]]; then
            echo "invalid job_id; skipping early bot notification" >&2
            exit 0
          fi
          # bug-57: keep status.series in sync with the durable request from
          # the very first status write. The bot seeds series at job creation,
          # but any rewrite path that loses it (e.g. an archived/restarted
          # status record) used to leave the block zeroed forever, which broke
          # the task header, Zernio suppression, and the next-part affordance.
          # The request JSON is the authoritative pre-plan series source; its
          # block lacks is_final, which the Stage B plan sync fills in later.
          series_json="$(python - "$job_id" <<'PY' || true
          import json, sys
          try:
              req = json.load(open(f"jobs/{sys.argv[1]}/stage-a-request.json", encoding="utf-8"))
              print(json.dumps(req.get("series") or {}))
          except (OSError, json.JSONDecodeError):
              pass
          PY
          )"
          series_args=()
          if [ -n "$series_json" ] && [ "$series_json" != "{}" ]; then
            series_args=(--series-json "$series_json")
          fi
          python -m pipeline.status "$job_id" \
            --state stage_a_running \
            --message "Stage A run started on GitHub Actions — setting up." \
            --release-tag "clipforge-$job_id" \
            "${series_args[@]}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --code-ref "$(git rev-parse HEAD)" || { echo "WARN: status write failed" >&2; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/$job_id/"
          git commit -m "clipforge: job $job_id stage A started (bot notify)" || echo "nothing to commit"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash || true; sleep 2
          done
          echo "WARN: early bot-notification push failed; later status steps will carry it." >&2

      - name: Resolve job + read the Stage A request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          # Bug 1 fix: never fail in THIS step. The job_id output must always
          # be set so the "On failure" handler can persist an error status even
          # when validation itself is what fails; the hard stop happens one
          # step later in "Validate resolved job".
          job_id="${{ inputs.job_id }}"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "release_tag=clipforge-$job_id" >> "$GITHUB_OUTPUT"
          if ! [[ "$job_id" =~ ^[A-Za-z0-9._-]{1,120}$ ]]; then
            echo "Invalid job_id" >&2
            echo "job_valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          req="jobs/$job_id/stage-a-request.json"
          if ! test -f "$req"; then
            echo "Missing $req — the bot must write it before dispatch" >&2
            echo "job_valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "job_valid=true" >> "$GITHUB_OUTPUT"
          python - "$req" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          def put(k, v): print(f"{k}={v}")
          mode = data.get("mode", "manual")
          put("mode", mode if mode in ("manual", "automatic") else "manual")
          src = data.get("source", {})
          kind = src.get("kind", "")
          put("source_kind", kind if re.fullmatch(r"[a-z_]{1,32}", kind) else "unknown")
          opts = data.get("options", {})
          wm = opts.get("whisper_model", "base")
          put("whisper_model", wm if wm in ("tiny", "base", "small") else "base")
          # bug-65: default is auto-detect ("auto") so Whisper can identify the
          # real source language; the translate task then renders any
          # non-English audio into English. Never force "en" here — that would
          # suppress detection of genuinely non-English audio.
          lang = str(opts.get("language", "auto"))
          put("language", lang if re.fullmatch(r"[A-Za-z-]{2,12}", lang) else "auto")
          # bug-65: translation to English is the default pipeline behavior; a
          # request may explicitly opt out with options.task = "transcribe".
          task = str(opts.get("task", "translate_to_english"))
          put("task", task if task in ("transcribe", "translate_to_english") else "translate_to_english")
          put("vision_assist", "true" if opts.get("enable_vision_assist", True) else "false")
          series = data.get("series", {})
          put("series_enabled", "true" if series.get("enabled") else "false")
          src_job = str(series.get("source_job_id", ""))
          # bug-64: legacy/broken requests carry a SERIES id here instead of a
          # job id. bug-61 deliberately seeded source_job_id with the series id
          # (mistaking series-<ts> for Part 1's job id, which is really
          # manual-<ts>), so Part 2's reuse step tried to download
          # clipforge-series-<ts> — a release that never exists — and died with
          # "release not found". The wizard now persists wizard.jobId for new
          # series; the bot's continuation re-points blank values at the
          # completing part's own job id. This reader is the last safety net:
          # any 'series-'-shaped source_job_id is re-pointed at the CURRENT
          # job's Part 1 (same series id, '-p1'), which is where the reuse
          # evidence actually lives. Job ids themselves never start with
          # 'series-' for a Part >= 2 continuation ('manual-<ts>' /
          # '<series_id>-p<N>'), so this rewrite cannot misfire on valid data.
          if src_job.startswith("series-"):
              cur = str(data.get("job_id", ""))
              m = re.fullmatch(r"(series-[A-Za-z0-9._-]+)-p(\d+)", cur)
              if m and int(m.group(2)) >= 2:
                  src_job = f"{m.group(1)}-p1"
          put("series_source_job_id", src_job if re.fullmatch(r"[A-Za-z0-9._-]{1,120}", src_job) else "")
          put("target_duration_seconds", str(int(opts.get("target_duration_seconds", 120) or 120)))
          PY

      - name: Validate resolved job
        if: ${{ steps.req.outputs.job_valid != 'true' }}
        shell: bash
        run: |
          echo "Stage A cannot run for job '${{ steps.req.outputs.job_id }}': the id is invalid or its stage-a-request.json is missing." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system + minimal ingest deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg aria2 file
          python -m pip install --upgrade -q pip
          python -m pip install -q "requests>=2.32,<3"
          # §9.1: MTProto client for public Telegram channel-post downloads.
          # Present on every runner, but only reachable on the original repo —
          # telegram_channel.py fails closed on any other repository, and
          # clones never receive the CLIPFORGE_TELEGRAM_* secrets.
          python -m pip install -q "telethon>=1.44,<2" "cryptg>=0.4,<1"
          ffmpeg -version | head -n 1

      - name: Write initial status (stage_a_running)
        shell: bash
        run: |
          set -euo pipefail
          python -m pipeline.status "${{ steps.req.outputs.job_id }}" \
            --state stage_a_running --mode "${{ steps.req.outputs.mode }}" \
            --message "Stage A starting — ingesting source (${{ steps.req.outputs.source_kind }})" \
            --release-tag "${{ steps.req.outputs.release_tag }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --code-ref "$(git rev-parse HEAD)"

      - name: Commit initial status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ steps.req.outputs.job_id }}/"
          git commit -m "clipforge: job ${{ steps.req.outputs.job_id }} stage A running" || echo "nothing to commit"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash || true; sleep 2
          done
          echo "WARN: initial status push failed; the final status commit will carry it." >&2

      # ---------------------------------------------------------------------
      # SERIES CONTINUATION — reuse the source job's Stage A evidence
      # (§11: later parts reuse Part 1's transcript/indexes/screenshots and
      # the same original video).
      # ---------------------------------------------------------------------
      - name: Reuse original Stage A evidence for a Series continuation
        id: series_reuse
        if: ${{ steps.req.outputs.series_enabled == 'true' && steps.req.outputs.series_source_job_id != '' && steps.req.outputs.series_source_job_id != steps.req.outputs.job_id }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_job="${{ steps.req.outputs.series_source_job_id }}"
          mkdir -p work/series-source
          # --clobber: a re-run of this workflow reuses the workspace, and a
          # partial first download would otherwise abort the retry.
          # bug-64: retry with backoff — a freshly-queued continuation can race
          # the source release's propagation, and the previous single attempt
          # died with "release not found" on any transient read miss.
          # bug-69: download the reusable EVIDENCE separately from
          # source_input.bin — Part 1's release may legitimately have no source
          # (intentionally omitted because it exceeded the 2 GiB per-asset
          # limit), and that must NOT fail the continuation here.
          attempt=1
          until gh release download "clipforge-$source_job" --repo "$GITHUB_REPOSITORY" --dir work/series-source \
            --pattern 'transcript.json' --pattern 'scene_index.json' --pattern 'key_moments.json' \
            --pattern 'screenshots.zip' --clobber; do
            if [ "$attempt" -ge 6 ]; then
              echo "release clipforge-$source_job still unavailable after $attempt attempts" >&2
              exit 1
            fi
            echo "release clipforge-$source_job not readable yet (attempt $attempt) — retrying in 15s"
            sleep 15
            attempt=$((attempt + 1))
          done
          mkdir -p work/screenshots work/analysis
          cp work/series-source/transcript.json work/transcript.json
          cp work/series-source/scene_index.json work/scene_index.json
          cp work/series-source/key_moments.json work/key_moments.json
          unzip -q work/series-source/screenshots.zip -d work/screenshots
          # bug-69: try the release's source first (zero behavior change for the
          # common case); when it was omitted from Part 1's release for size, fall
          # through to re-fetching from Part 1's ORIGINAL saved source reference
          # (series parts share one underlying source; Part 1's
          # stage-a-request.json holds it — e.g. the exact torrent_file_index).
          if gh release download "clipforge-$source_job" --repo "$GITHUB_REPOSITORY" --dir work/series-source \
              --pattern 'source_input.bin' --clobber; then
            cp work/series-source/source_input.bin work/original.bin
            echo "series reuse: source_input.bin present in clipforge-$source_job — reused directly"
          else
            echo "series reuse: source_input.bin absent from clipforge-$source_job (omitted for size) — re-fetching from the original saved source reference"
            python -m pipeline.stage_a.refetch_source "${{ steps.req.outputs.job_id }}" work/refetch \
              --jobs-root jobs --source-job "$source_job"
            cp work/refetch/original.* work/original.bin
          fi
          # bug-68: analysis_720p.mp4 is no longer produced, bundled, or
          # uploaded anywhere — nothing downstream ever read it. Series reuse
          # therefore neither downloads it nor requires it; bundle assembly
          # no longer expects it either.
          python - <<'PY'
          import json
          rec = {"version": 1, "job_id": "${{ steps.req.outputs.job_id }}",
                 "source_kind": "series_reuse",
                 "original_path": "work/original.bin",
                 "original_asset_name": "source_input.bin",
                 "size_bytes": __import__("os").path.getsize("work/original.bin"),
                 "container": "bin", "ingested_at_epoch": int(__import__("time").time())}
          import os, pathlib
          pathlib.Path("jobs/${{ steps.req.outputs.job_id }}").mkdir(parents=True, exist_ok=True)
          pathlib.Path("jobs/${{ steps.req.outputs.job_id }}/ingest.json").write_text(json.dumps(rec, indent=2) + "\n")
          tx = json.load(open("work/transcript.json", encoding="utf-8"))
          dur = int(round(float(tx.get("audio_duration_seconds") or 0)))
          if dur <= 0:
              dur = int(round(float(json.load(open("work/scene_index.json")).get("video_duration_seconds") or 0)))
          if dur <= 0: raise SystemExit("Could not recover source duration from reused evidence.")
          print(f"DURATION_SECONDS={dur}")
          PY
          echo "reused=true" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # INGEST — resolve the source into work/original.<ext>.
      # Exit codes: 0 ok · 3 awaiting_torrent_selection (clean stop) ·
      # 4 preserved-subsystem gate · 2 ingest error.
      # ---------------------------------------------------------------------
      - name: Ingest source (url, drive, magnet, torrent_file, telegram_channel, telegram_relay)
        id: ingest
        if: ${{ steps.series_reuse.outputs.reused != 'true' }}
        shell: bash
        env:
          # bug-32: the telegram_relay ingest path must be able to fetch its
          # temporary prerelease asset from the release. GH_TOKEN is the same
          # scoped credential the release-URL / download steps below already
          # use; without it ingest.py failed with "needs GH_TOKEN" (exit 2),
          # nothing was uploaded, and Stage B then reported the source missing.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dedicated user-authorized MTProto media session for public Telegram
          # channel posts (§9.1). Original repo ONLY — clones never receive
          # these secrets, so telegram_channel.py fails closed there. GitHub
          # masks encrypted secrets; the downloader never logs them.
          CLIPFORGE_TELEGRAM_API_ID: ${{ secrets.CLIPFORGE_TELEGRAM_API_ID }}
          CLIPFORGE_TELEGRAM_API_HASH: ${{ secrets.CLIPFORGE_TELEGRAM_API_HASH }}
          CLIPFORGE_TELEGRAM_SESSION: ${{ secrets.CLIPFORGE_TELEGRAM_SESSION }}
        run: |
          # bug-43: Actions' bash shell already runs with -eo pipefail, and
          # 'set -uo pipefail' does NOT clear -e — so a non-zero ingest exit
          # aborted the script before code=$? ran, the exit-3 torrent-selection
          # park surfaced as a RED failed step, the Park step was skipped, and
          # the 'On failure' step overwrote the parked
          # awaiting_torrent_selection status with 'Stage A failed' (observed
          # in job manual-1787899627063). Explicitly disable -e around the
          # ingest invocation so exit code 3 is captured and handled below.
          set -uo pipefail
          mkdir -p work
          set +e
          python -m pipeline.stage_a.ingest "${{ steps.req.outputs.job_id }}" work
          code=$?
          set -e
          case "$code" in
            0) echo "result=ok" >> "$GITHUB_OUTPUT" ;;
            3) echo "result=awaiting_torrent" >> "$GITHUB_OUTPUT" ;;
            *) echo "result=failed" >> "$GITHUB_OUTPUT"; exit "$code" ;;
          esac

      - name: Park for torrent selection (multi-file source, user pick needed)
        if: ${{ steps.ingest.outputs.result == 'awaiting_torrent' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ steps.req.outputs.job_id }}/"
          git commit -m "clipforge: job ${{ steps.req.outputs.job_id }} awaiting torrent selection" || echo "nothing to commit"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash || true; sleep 2
          done
          echo "FATAL: could not persist awaiting_torrent_selection status" >&2; exit 1

      - name: Install full analysis deps
        if: ${{ steps.ingest.outputs.result == 'ok' || steps.series_reuse.outputs.reused == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "faster-whisper==1.0.3" "onnxruntime>=1.17,<2" "numpy>=1.24,<3"
          python - <<'PY'
          import onnxruntime  # noqa: F401 — surface ABI failures here, not in VAD
          print("onnxruntime import: OK")
          PY

      # bug-68: this step used to also transcode a full 720p analysis copy
      # (work/analysis/analysis_720p.mp4) for the release bundle. Nothing
      # downstream ever consumed that file — it was generated, uploaded, and
      # never read — so the transcode is removed entirely. Only the duration
      # probe below is load-bearing (DURATION_SECONDS feeds scenes/prompt).
      - name: Probe source duration
        if: ${{ steps.ingest.outputs.result == 'ok' }}
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_PATH="$(python -c "import json; print(json.load(open('jobs/${{ steps.req.outputs.job_id }}/ingest.json'))['original_path'])")"
          dur="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$ORIGINAL_PATH")"
          dur_int="$(python -c "import sys; print(int(round(float(sys.argv[1]))))" "$dur")"
          echo "DURATION_SECONDS=$dur_int" >> "$GITHUB_ENV"
          echo "Duration: $dur ($dur_int s)"

      - name: Recover duration from reused evidence
        if: ${{ steps.series_reuse.outputs.reused == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          dur="$(python -c "import json; print(int(round(float(json.load(open('work/scene_index.json')).get('video_duration_seconds') or 0))))")"
          test "$dur" -gt 0
          echo "DURATION_SECONDS=$dur" >> "$GITHUB_ENV"

      - name: Extract audio + transcribe (faster-whisper, CPU)
        if: ${{ steps.ingest.outputs.result == 'ok' }}
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_PATH="$(python -c "import json; print(json.load(open('jobs/${{ steps.req.outputs.job_id }}/ingest.json'))['original_path'])")"
          python -m pipeline.status "${{ steps.req.outputs.job_id }}" \
            --state stage_a_running --message "Transcribing audio (faster-whisper CPU)"
          ffmpeg -y -i "$ORIGINAL_PATH" -vn -ac 1 -ar 16000 -c:a pcm_s16le work/audio.wav
          python -m pipeline.stage_a.transcribe work/audio.wav work/transcript.json \
            --model "${{ steps.req.outputs.whisper_model }}" \
            --lang "${{ steps.req.outputs.language }}" \
            --task "${{ steps.req.outputs.task }}"

      - name: Local vision-assist stack (shots, key moments, composites)
        if: ${{ steps.ingest.outputs.result == 'ok' && steps.req.outputs.vision_assist == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_PATH="$(python -c "import json; print(json.load(open('jobs/${{ steps.req.outputs.job_id }}/ingest.json'))['original_path'])")"
          python -m pipeline.status "${{ steps.req.outputs.job_id }}" \
            --state stage_a_running --message "Building local vision-assist indexes"
          python -m pipeline.stage_a.scenes all \
            "$ORIGINAL_PATH" \
            work/transcript.json \
            "$DURATION_SECONDS" \
            work \
            --window-seconds 6 --threshold 0.35 --max-moments 60

      - name: Vision-assist disabled — write empty stub indexes
        if: ${{ steps.ingest.outputs.result == 'ok' && steps.req.outputs.vision_assist == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_PATH="$(python -c "import json; print(json.load(open('jobs/${{ steps.req.outputs.job_id }}/ingest.json'))['original_path'])")"
          mkdir -p work/screenshots
          ffmpeg -y -i "$ORIGINAL_PATH" \
            -vf "fps=1,scale='min(640,iw)':'-2',tile=3x2:padding=2:margin=2:color=black" \
            -vsync vfr -qscale:v 5 -start_number 0 work/screenshots_tmp/grid_%05d.jpg
          python - "$DURATION_SECONDS" <<'PY'
          import json, sys
          for path, extra in [("work/scene_index.json", {"shot_count": 0, "shots": []}),
                              ("work/key_moments.json", {"moment_count": 0, "moments": []})]:
              payload = {"video_duration_seconds": float(sys.argv[1])}
              payload.update(extra)
              open(path, "w").write(json.dumps(payload, indent=2))
          PY

      - name: Assemble the analysis bundle (prompt + zips + manifest)
        if: ${{ steps.ingest.outputs.result == 'ok' || steps.series_reuse.outputs.reused == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pipeline.status "${{ steps.req.outputs.job_id }}" \
            --state stage_a_running --message "Assembling analysis bundle"
          python -m pipeline.stage_a.bundle "${{ steps.req.outputs.job_id }}" work \
            --release-tag "${{ steps.req.outputs.release_tag }}" \
            --duration-seconds "$DURATION_SECONDS"
          ls -lh work/bundle/

      # ---------------------------------------------------------------------
      # bug-69: SEQUENCING — try the FULL bundle (including source_input.bin)
      # exactly as today. There is deliberately NO pre-emptive size check that
      # skips the source: it is only ever omitted in response to an ACTUAL
      # upload failure caused by GitHub's 2 GiB per-asset limit. The step below
      # is continue-on-error purely so a bash gate can (a) CLASSIFY the failure
      # — only a confirmed per-asset size-limit signature may drop the source,
      # any other failure re-fails immediately — and (b) drive an idempotent
      # retry that re-uploads everything EXCEPT source_input.bin via the
      # GitHub API directly (POST, overwriting same-named assets left over from
      # a partially-succeeded first attempt, so nothing duplicates or errors).
      # The body here intentionally does NOT mention source_input.bin: when the
      # first attempt succeeds outright, GitHub keeps this action-authored body
      # (the retry's PATCH never runs), so a full release is never mislabelled
      # as a source-omitted one. The omitted-source body is applied ONLY on the
      # confirmed failure path below.
      # ---------------------------------------------------------------------
      - name: Create GitHub Release with the analysis bundle
        id: release_full
        if: ${{ steps.ingest.outputs.result == 'ok' || steps.series_reuse.outputs.reused == 'true' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.req.outputs.release_tag }}
          name: "ClipForge job ${{ steps.req.outputs.job_id }}"
          body: |
            ClipForge Stage A analysis bundle (ARCHITECTURE.md §7.2).

            clipforge-job-id: ${{ steps.req.outputs.job_id }}
            stage: awaiting_plan

            Assets: 00_READ_THIS_FIRST.txt (agent prompt), transcript.json,
            scene_index.json, key_moments.json, screenshots.zip,
            event_composites.zip (when vision assist produced events),
            source_input.bin (full-quality source for Stage B),
            manifest.json.

            This release is automatically deleted ~12 hours after creation.
          make_latest: "false"
          prerelease: true
          files: work/bundle/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate the release outcome / retry without an oversized source
        id: release_gate
        if: ${{ steps.ingest.outputs.result == 'ok' || steps.series_reuse.outputs.reused == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.release_full.outcome }}" = "success" ]; then
            echo "Release published with the full bundle (including source_input.bin)."
            echo "source_omitted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${{ steps.req.outputs.release_tag }}"
          echo "Full-bundle release attempt failed — inspecting the release to classify the cause."

          # CLASSIFY: only treat this as the 2 GiB per-asset limit when the
          # evidence actually says so. The gate is: source_input.bin is oversized
          # (> 2 GiB) AND every asset that must have been uploaded BEFORE it was
          # reached is present. work/bundle/* uploads in sorted order, and
          # source_input.bin sorts second-to-last — so the pre-source prefix
          # (00_READ_THIS_FIRST.txt .. screenshots.zip) MUST have landed before
          # the source failed, while transcript.json (+ manifest.json when the
          # action crashed before even creating the release) sort AFTER it and
          # are therefore allowed to be missing — the idempotent retry below
          # fills them in. Any other failure shape (source within the limit, a
          # missing PRE-source asset) is NOT the size-limit path and re-fails
          # here rather than being silently retried without the source.
          python - "$tag" <<'PY'
          import json, os, subprocess, sys
          tag = sys.argv[1]
          LIMIT = 2 * 1024**3  # GitHub's hard per-file release-asset limit: 2 GiB
          src = "work/bundle/source_input.bin"
          src_size = os.path.getsize(src) if os.path.exists(src) else 0
          try:
              rel = json.loads(subprocess.run(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"],
                  capture_output=True, text=True, check=True).stdout)
          except subprocess.CalledProcessError:
              rel = {"assets": []}  # release never created (action crashed on the source)
          present = {a.get("name") for a in rel.get("assets", [])}
          # Assets that precede source_input.bin in the sorted upload order.
          prefix = {"00_READ_THIS_FIRST.txt", "key_moments.json",
                    "scene_index.json", "screenshots.zip"}
          if os.path.exists("work/bundle/event_composites.zip"):
              prefix.add("event_composites.zip")
          missing_prefix = prefix - present
          print(f"source_input.bin size: {src_size} bytes (2 GiB limit: {LIMIT})")
          print(f"published assets: {sorted(present) or 'none'}")
          if src_size > LIMIT and not missing_prefix:
              print("CLASSIFIED: oversized-source release failure — retrying WITHOUT source_input.bin.")
              sys.exit(0)
          print("NOT a size-limit failure "
                f"(source_oversized={src_size > LIMIT}, missing_prefix={sorted(missing_prefix)}). "
                "Refusing to drop the source; re-failing.", file=sys.stderr)
          sys.exit(1)
          PY

          # ---- idempotent retry: re-upload everything EXCEPT source_input.bin ----
          # GitHub's asset API does NOT overwrite a same-named asset — a re-POST
          # returns 422 'already_exists'. To stay idempotent against a partially-
          # succeeded first attempt (some keep-assets already uploaded), DELETE any
          # existing same-named asset first, then POST fresh. Create the release
          # itself if the action crashed before creating it.
          python - "$tag" <<'PY'
          import json, os, subprocess, sys, glob, mimetypes
          tag = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]
          job = "${{ steps.req.outputs.job_id }}"
          try:
              rel = json.loads(subprocess.run(
                  ["gh", "api", f"repos/{repo}/releases/tags/{tag}"],
                  capture_output=True, text=True, check=True).stdout)
          except subprocess.CalledProcessError:
              print("release not found — creating it (the first attempt crashed before creation)")
              rel = json.loads(subprocess.run(
                  ["gh", "api", "--method", "POST", f"repos/{repo}/releases",
                   "-f", f"tag_name={tag}", "-f", f"name=ClipForge job {job}",
                   "-F", "draft=false", "-F", "prerelease=true",
                   "-F", "make_latest=false"],
                  capture_output=True, text=True, check=True).stdout)
          rel_id = rel["id"]
          upload_base = f"https://uploads.github.com/repos/{repo}/releases/{rel_id}/assets"
          existing = {a.get("name"): a.get("id") for a in rel.get("assets", [])}
          for path in sorted(glob.glob("work/bundle/*")):
              name = os.path.basename(path)
              if name == "source_input.bin":
                  print(f"SKIP (oversized, intentionally omitted): {name}")
                  continue
              if name in existing:
                  print(f"delete leftover asset for clean re-upload: {name} (id={existing[name]})")
                  subprocess.run(
                      ["gh", "api", "--method", "DELETE",
                       f"repos/{repo}/releases/assets/{existing[name]}"],
                      check=True)
              ctype = mimetypes.guess_type(name)[0] or "application/octet-stream"
              print(f"upload: {name}")
              # gh api -F data=@file would JSON-ENCODE the bytes (verified:
              # {"data":"\\u0000..."} — the stored asset is corrupted JSON, not
              # the file). --input streams the RAW file as the request body,
              # which is what the release-asset upload endpoint requires.
              subprocess.run(
                  ["gh", "api", "--method", "POST", "-H",
                   f"Content-Type: {ctype}", "--input", path,
                   f"{upload_base}?name={name}"],
                  check=True)
          print("retry upload complete")
          PY

          # Record the INTENTIONAL omission unambiguously in the release body so
          # anything reading it later (bot message, Stage B, a series
          # continuation) can distinguish "legitimately no source — re-fetch it"
          # from "this release is broken".
          python - "$tag" <<'PY'
          import json, os, subprocess, sys
          tag = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]
          job = "${{ steps.req.outputs.job_id }}"
          rel = json.loads(subprocess.run(
              ["gh", "api", f"repos/{repo}/releases/tags/{tag}"],
              capture_output=True, text=True, check=True).stdout)
          body = (
              "ClipForge Stage A analysis bundle (ARCHITECTURE.md §7.2).\n\n"
              f"clipforge-job-id: {job}\n"
              "stage: awaiting_plan\n"
              "source-omitted: true\n\n"
              "NOTE: source_input.bin was INTENTIONALLY OMITTED from this release — "
              "the source exceeded GitHub's 2 GiB per-asset limit. This is not a "
              "broken release. Stage B (or a series continuation) re-fetches the "
              "source directly from the original source reference durably saved in "
              f"jobs/{job}/stage-a-request.json.\n\n"
              "Assets: 00_READ_THIS_FIRST.txt (agent prompt), transcript.json, "
              "scene_index.json, key_moments.json, screenshots.zip, "
              "event_composites.zip (when vision assist produced events), "
              "manifest.json.\n\n"
              "This release is automatically deleted ~12 hours after creation."
          )
          subprocess.run(
              ["gh", "api", "--method", "PATCH",
               f"repos/{repo}/releases/{rel['id']}",
               "-f", f"body={body}"],
              check=True)
          print("release body updated: source omission recorded")
          PY

          echo "source_omitted=true" >> "$GITHUB_OUTPUT"

      - name: Record an omitted source in the manifest (machine-readable)
        if: ${{ steps.release_gate.outputs.source_omitted == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p = "work/bundle/manifest.json"
          m = json.load(open(p))
          m["source_omitted"] = True
          m["source_omitted_reason"] = (
              "source_input.bin exceeded GitHub's 2 GiB per-asset release limit; "
              "intentionally omitted. Re-fetch via the source object in "
              "stage-a-request.json (pipeline.stage_a.refetch_source)."
          )
          # Reflect the omission in the asset list too: drop the entry entirely.
          m["assets"] = [a for a in m["assets"] if a.get("name") != "source_input.bin"]
          open(p, "w").write(json.dumps(m, ensure_ascii=False, indent=2) + "\n")
          print("manifest updated: source_omitted=true")
          PY
          # Re-upload the corrected manifest. The retry already uploaded a
          # manifest.json, and GitHub's asset API does not overwrite same-named
          # assets (re-POST -> 422), so delete the leftover first, then POST.
          tag="${{ steps.req.outputs.release_tag }}"
          rel_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
          old_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name=="manifest.json") | .id' | head -n 1)"
          if [ -n "$old_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id" >/dev/null
          fi
          # --input streams the raw file bytes (gh api -F data=@file would
          # JSON-encode them and corrupt the stored asset).
          gh api --method POST -H "Content-Type: application/json" \
            --input work/bundle/manifest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rel_id/assets?name=manifest.json" >/dev/null
          echo "corrected manifest re-uploaded"

      - name: Resolve release asset URLs
        id: assets
        if: ${{ steps.ingest.outputs.result == 'ok' || steps.series_reuse.outputs.reused == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.req.outputs.release_tag }}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" | python -c '
          import json, os, sys
          data = json.load(sys.stdin)
          out = {a["name"]: a["browser_download_url"] for a in data.get("assets", [])}
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("release_url=" + data.get("html_url", "") + "\n")
              f.write("assets_json=" + json.dumps(out) + "\n")
          '

      # bug-30: every successful Stage A now lands in awaiting_plan (the Gemini
      # automatic-analysis branch below is removed). The mode guard is gone so
      # the state no longer depends on a 'manual' vs 'automatic' split.
      - name: Write awaiting_plan status
        if: ${{ (steps.ingest.outputs.result == 'ok' || steps.series_reuse.outputs.reused == 'true') }}
        shell: bash
        env:
          ASSETS_JSON: ${{ steps.assets.outputs.assets_json }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          assets = json.loads(os.environ["ASSETS_JSON"])
          PY
          python -m pipeline.status "${{ steps.req.outputs.job_id }}" \
            --state awaiting_plan \
            --message "Stage A complete. Get the agent prompt from the release, run your agent, then upload production.json to start Stage B." \
            --release-url "${{ steps.assets.outputs.release_url }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("jobs/${{ steps.req.outputs.job_id }}/status.json")
          data = json.loads(p.read_text())
          data.setdefault("assets", {}).update(json.loads(os.environ["ASSETS_JSON"]))
          data["assets"]["analysis_bundle_url"] = os.environ.get("RELEASE_URL", "")
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False))
          PY

      - name: Commit final status
        if: ${{ (steps.ingest.outputs.result == 'ok' || steps.series_reuse.outputs.reused == 'true') }}
        shell: bash
        env:
          RELEASE_URL: ${{ steps.assets.outputs.release_url }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ steps.req.outputs.job_id }}/"
          git commit -m "clipforge: job ${{ steps.req.outputs.job_id }} awaiting production.json" || echo "nothing to commit"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "final status push attempt $attempt failed — rebasing and retrying…" >&2
            git pull --rebase --autostash; sleep 2
          done
          echo "FATAL: could not persist the awaiting_plan status to origin after 3 attempts." >&2
          exit 1

      # bug-30: the automatic-mode Gemini branch and its fallback were removed
      # — Stage A only ever ends in awaiting_plan now, so the only failure
      # handler needed is the generic error one below.
      - name: On failure, write error status
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          # Bug 1 fix: this handler must ALWAYS leave a readable error status
          # behind, including for failures before the request step completed
          # (checkout, setup, validation). steps.req.outputs.job_id is now
          # emitted unconditionally; if it is still unusable we surface the
          # failure instead of letting || true swallow it silently.
          job_id="${{ steps.req.outputs.job_id }}"
          if ! [[ "$job_id" =~ ^[A-Za-z0-9._-]{1,120}$ ]]; then
            echo "FATAL: Stage A failed before a usable job_id was resolved; no status file can be written." >&2
            exit 1
          fi
          python -m pipeline.status "$job_id" --state error \
            --message "Stage A failed. See workflow run for logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --release-tag "${{ steps.req.outputs.release_tag }}" || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/$job_id/" || true
          git commit -m "clipforge: job $job_id stage A error" || true
          pushed=false
          for attempt in 1 2 3; do
            if git push; then pushed=true; break; fi
            git pull --rebase --autostash || true
            sleep 2
          done
          if [ "$pushed" != "true" ]; then
            echo "FATAL: could not persist the stage A error status for job $job_id." >&2
            exit 1
          fi
