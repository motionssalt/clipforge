name: Stage B — Cut Scenes (Separate Files)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (must match an existing Stage A release: clipforge-<job_id>)"
        required: true
        type: string
      cuts_ref:
        description: "Where cuts.json lives. One of: path:<repo-path> | asset:<asset-name> | url:<https-url>"
        required: true
        type: string
        default: "path:jobs/<JOB_ID>/cuts.json"
      enhance:
        description: "Apply the tuned quality enhancement filter chain (denoise + color grade + sharpen) to each cut scene after cutting. Default true; set to false to ship unenhanced scenes for comparison."
        required: false
        type: string
        default: "true"

permissions:
  contents: write

concurrency:
  group: clipforge-stage-b-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  stage_b:
    name: Stage B
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: jid
        shell: bash
        run: |
          set -euo pipefail
          jid="${{ github.event.inputs.job_id }}"
          jid="$(echo "$jid" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')"
          echo "job_id=$jid" >> "$GITHUB_OUTPUT"
          echo "release_tag=clipforge-$jid" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg installation
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1

      - name: Install Python deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Write stage_b_running status
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_status.py "${{ steps.jid.outputs.job_id }}" "stage_b_running" \
            --message "Stage B started: cutting original video" \
            --release-tag "${{ steps.jid.outputs.release_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "jobs/${{ steps.jid.outputs.job_id }}/status.json"
          git commit -m "clipforge: job ${{ steps.jid.outputs.job_id }} stage B running" || echo "nothing to commit"
          git push || true

      - name: Load release metadata (find original video asset)
        id: relmeta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.jid.outputs.release_tag }}"
          repo="${GITHUB_REPOSITORY}"
          json="$(gh api "repos/${repo}/releases/tags/${tag}")"
          echo "$json" > work_release.json
          rid="$(python -c "import json; print(json.load(open('work_release.json'))['id'])")"
          echo "release_id=$rid" >> "$GITHUB_OUTPUT"
          rurl="$(python -c "import json; print(json.load(open('work_release.json')).get('html_url',''))")"
          echo "release_url=$rurl" >> "$GITHUB_OUTPUT"

          # Pull original asset info by name prefix.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("work_release.json"))
          for a in data.get("assets", []):
              if a["name"].startswith("original."):
                  print(f"orig_name={a['name']}")
                  print(f"orig_url={a['browser_download_url']}")
                  print(f"orig_id={a['id']}")
                  break
          PY

      - name: Download original video from release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work
          # Use gh api with Accept: octet-stream to download the private asset.
          orig_id="${{ steps.relmeta.outputs.orig_id }}"
          orig_name="${{ steps.relmeta.outputs.orig_name }}"
          if [ -z "$orig_id" ] || [ -z "$orig_name" ]; then
            echo "Could not find original video asset in release" >&2
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${orig_id}" \
            > "work/${orig_name}"
          ls -lh "work/${orig_name}"
          echo "ORIGINAL_PATH=work/${orig_name}" >> "$GITHUB_ENV"

      - name: Resolve cuts.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.cuts_ref }}"
          jid="${{ steps.jid.outputs.job_id }}"

          # Support placeholder <JOB_ID> in the default form
          ref="${ref//<JOB_ID>/$jid}"

          case "$ref" in
            path:*)
              src="${ref#path:}"
              if [ ! -f "$src" ]; then
                echo "cuts.json not found at repo path: $src" >&2
                exit 1
              fi
              cp "$src" work/cuts.json
              ;;
            url:*)
              src="${ref#url:}"
              curl -fSL --retry 3 -o work/cuts.json "$src"
              ;;
            asset:*)
              name="${ref#asset:}"
              tag="${{ steps.jid.outputs.release_tag }}"
              aid="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                    --jq ".assets[] | select(.name==\"$name\") | .id")"
              if [ -z "$aid" ]; then
                echo "asset not found: $name" >&2; exit 1
              fi
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" \
                > work/cuts.json
              ;;
            *)
              echo "Unknown cuts_ref format: $ref" >&2; exit 1;;
          esac

          echo "cuts.json head:"
          head -c 400 work/cuts.json; echo

          # Extract the one-per-job title the analysis agent put in
          # cuts.json (see generate_analysis_prompt.py). Optional: a
          # missing/blank title exports an empty string and the rest of
          # the pipeline ships without a title line.
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          raw = (json.load(open("work/cuts.json")).get("title") or "").strip()
          print("JOB_TITLE=" + raw)
          PY
          if [ -n "$JOB_TITLE" ]; then
            echo "Job title: $JOB_TITLE"
          else
            echo "No top-level title in cuts.json (optional field)."
          fi

      # -------------------------------------------------------------------
      # Persistent channel branding (branding/branding.json on the default
      # branch, written by the site's Settings panel via the contents API).
      # It lives OUTSIDE jobs/ so the 12-hour cleanup never deletes it.
      # This step only RECORDS which branding (and which job title) this
      # run used in status.json's `extra` — actually rendering the title /
      # branding onto the video frames is a separate addition and is
      # deliberately not wired here.
      # -------------------------------------------------------------------
      - name: Load persistent channel branding (branding/branding.json)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os

          doc = {}
          try:
              with open("branding/branding.json", encoding="utf-8") as f:
                  doc = json.load(f)
          except FileNotFoundError:
              print("branding/branding.json not found — no branding saved yet")
          except Exception as e:
              print(f"branding/branding.json unreadable ({e}) — continuing without branding")

          username = (doc.get("username") or "").strip()
          display_name = (doc.get("display_name") or "").strip() or username
          picture = (doc.get("profile_picture") or "").strip()
          pic_present = bool(picture) and os.path.isfile(picture)
          if picture and not pic_present:
              print(f"branding picture listed but missing on disk: {picture} — ignoring")
              picture = ""

          if username:
              print(f"branding_username={username}")
              print(f"branding_display_name={display_name}")
              if picture:
                  print(f"branding_profile_picture={picture}")
          else:
              print("No branding configured (empty username) — job runs unbranded.")
          PY

      - name: Cut scenes with ffmpeg (NO concat — one MP4 per cut)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/out/scenes
          python scripts/cut_scenes.py \
            "$ORIGINAL_PATH" \
            work/cuts.json \
            MASTER_PROMPT.md \
            "work/out/scenes" \
            "work/out/output.txt"
          ls -lh work/out/ work/out/scenes/
          # Hard fail if no scene files were produced.
          shopt -s nullglob
          scenes=(work/out/scenes/scene_*.mp4)
          if [ ${#scenes[@]} -eq 0 ]; then
            echo "No scene_*.mp4 files were produced" >&2
            exit 1
          fi
          echo "Produced ${#scenes[@]} scene file(s)."

      # -------------------------------------------------------------------
      # Quality enhancement filter chain (Stage B, optional).
      #
      # Runs strictly AFTER cutting and BEFORE per-scene validation, so any
      # bug in the enhancement pass fails the same mobile-safety bar the cut
      # pass has to satisfy. Kept as its own step so it composes cleanly
      # with other Stage B additions (branding/overlay work is a separate
      # step deliberately not wired here). The `enhance` workflow_dispatch
      # input maps 1:1 to the site's on/off toggle: 'true' (default) runs
      # the tuned chain, 'false' short-circuits the script to a no-op.
      # -------------------------------------------------------------------
      - name: Quality enhancement (denoise + color grade + sharpen)
        shell: bash
        env:
          ENHANCE_FLAG: ${{ github.event.inputs.enhance }}
        run: |
          set -euo pipefail
          # Default to "true" when the input is unset (e.g. a re-run of an
          # older dispatch that didn't carry the enhance input yet), so
          # the shipped default matches the site's default-on toggle.
          flag="${ENHANCE_FLAG:-true}"
          case "$flag" in
            true|1|yes|on|True|TRUE)  enable_arg="--enabled" ;;
            false|0|no|off|False|FALSE) enable_arg="--no-enabled" ;;
            *)
              echo "Unrecognised enhance flag: '$flag' — defaulting to enabled." >&2
              enable_arg="--enabled"
              ;;
          esac
          echo "Quality enhancement flag: $flag -> $enable_arg"
          # Snapshot pre-enhance total bytes for a visible before/after log.
          before_bytes=$(du -cb work/out/scenes/scene_*.mp4 | tail -1 | awk '{print $1}')
          python scripts/enhance_scenes.py work/out/scenes "$enable_arg"
          after_bytes=$(du -cb work/out/scenes/scene_*.mp4 | tail -1 | awk '{print $1}')
          echo "scene bytes: ${before_bytes} -> ${after_bytes}"
          # Guard the size bar from the addition brief: warn (do not fail)
          # if enhancement inflated aggregate scene size by more than 25%.
          # In tuning against real anime footage the delta was ~+1%; if this
          # trips, the values likely need retuning against the current source.
          # before_bytes / after_bytes are exported so the python subprocess
          # actually sees them — shell vars aren't inherited automatically.
          export before_bytes after_bytes
          python - <<'PY'
          import os
          b = int(os.environ.get('before_bytes') or 0)
          a = int(os.environ.get('after_bytes') or 0)
          if b > 0:
              pct = (a - b) / b * 100.0
              print(f'aggregate size delta: {pct:+.1f}%')
              if pct > 25.0:
                  print(
                      f'WARNING: enhancement inflated aggregate scene size '
                      f'by {pct:.1f}% (> 25%). Values may need retuning.'
                  )
          PY


      - name: Validate every scene MP4 with ffprobe
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scenes=(work/out/scenes/scene_*.mp4)
          if [ ${#scenes[@]} -eq 0 ]; then
            echo "FAIL: no scene_*.mp4 files to validate" >&2
            exit 1
          fi
          echo "Validating ${#scenes[@]} scene file(s)…"
          for SCENE in "${scenes[@]}"; do
            echo ""
            echo "=== $SCENE ==="
            echo "--- ffprobe: format info ---"
            ffprobe -v error -show_entries format=format_name,duration \
              -of default=noprint_wrappers=1 "$SCENE"
            echo "--- MP4 signature check ---"
            python3 - "$SCENE" <<'PY'
          import sys
          with open(sys.argv[1], 'rb') as f:
              sig = f.read(12)
          if sig[4:8] != b'ftyp':
              print(f'FAIL: {sys.argv[1]} is NOT a valid MP4 (missing ftyp box)', file=sys.stderr)
              sys.exit(1)
          print(f'PASS: {sys.argv[1]} has valid MP4 ftyp signature')
          PY
            echo "--- ffprobe: stream summary ---"
            ffprobe -v error -show_entries "stream=codec_type,codec_name,width,height" \
              -of default=noprint_wrappers=1 \
              "$SCENE"
          done
          echo ""
          echo "All ${#scenes[@]} scene file(s) validated."

      - name: Zip final artifacts (all individual scene files + output.txt)
        shell: bash
        run: |
          set -euo pipefail
          cd work/out
          zip -q "clipforge-${{ steps.jid.outputs.job_id }}-final.zip" \
            scenes/scene_*.mp4 \
            "output.txt"
          echo "Zip contents:"
          unzip -l "clipforge-${{ steps.jid.outputs.job_id }}-final.zip"
          ls -lh
          echo "FINAL_ZIP=work/out/clipforge-${{ steps.jid.outputs.job_id }}-final.zip" >> "$GITHUB_ENV"

      - name: Delete original video asset from release (no longer needed)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          orig_id="${{ steps.relmeta.outputs.orig_id }}"
          if [ -n "$orig_id" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${orig_id}" || true
          fi

      - name: Upload final zip + every individual scene file to the SAME release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.jid.outputs.release_tag }}
          name: "ClipForge job ${{ steps.jid.outputs.job_id }}"
          body: |
            ClipForge output.

            clipforge-job-id: ${{ steps.jid.outputs.job_id }}
            stage: complete

            Final artifacts (NO merged video — one MP4 per cut segment):
              - scene_01.mp4, scene_02.mp4, … — the individual scene files
              - clipforge-${{ steps.jid.outputs.job_id }}-final.zip
                (contains scenes/scene_01.mp4, scene_02.mp4, … + output.txt)

            This release is automatically deleted 12 hours after creation.
          make_latest: "false"
          prerelease: true
          files: |
            ${{ env.FINAL_ZIP }}
            work/out/scenes/scene_*.mp4
            work/out/output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve final asset URL
        id: finalasset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.jid.outputs.release_tag }}"
          url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                --jq ".assets[] | select(.name | endswith(\"-final.zip\")) | .browser_download_url")"
          echo "final_url=$url" >> "$GITHUB_OUTPUT"

      - name: Write complete status
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_status.py "${{ steps.jid.outputs.job_id }}" "complete" \
            --message "Scene videos are ready (one MP4 per cut segment)." \
            --release-tag "${{ steps.jid.outputs.release_tag }}" \
            --release-url "${{ steps.relmeta.outputs.release_url }}" \
            --asset "final_zip=${{ steps.finalasset.outputs.final_url }}"

          # Merge the job title + the branding this run used into status.json
          # (same inline-merge pattern Stage A uses for the asset URLs).
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("jobs") / os.environ["JID"] / "status.json"
          data = json.loads(p.read_text())
          extra = data.setdefault("extra", {})
          title = (os.environ.get("JOB_TITLE") or "").strip()
          if title:
              extra["title"] = title
          username = (os.environ.get("BRANDING_USERNAME") or "").strip()
          if username:
              extra["branding_username"] = username
              extra["branding_display_name"] = (os.environ.get("BRANDING_DISPLAY_NAME") or "").strip() or username
              if (os.environ.get("BRANDING_PROFILE_PICTURE") or "").strip():
                  extra["branding_profile_picture"] = os.environ["BRANDING_PROFILE_PICTURE"].strip()
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False))
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ steps.jid.outputs.job_id }}/status.json"
          git commit -m "clipforge: job ${{ steps.jid.outputs.job_id }} complete" || echo "nothing to commit"
          git push
        env:
          JID: ${{ steps.jid.outputs.job_id }}
          JOB_TITLE: ${{ env.JOB_TITLE }}
          BRANDING_USERNAME: ${{ env.BRANDING_USERNAME }}
          BRANDING_DISPLAY_NAME: ${{ env.BRANDING_DISPLAY_NAME }}
          BRANDING_PROFILE_PICTURE: ${{ env.BRANDING_PROFILE_PICTURE }}

      - name: On failure, write error status
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_status.py "${{ steps.jid.outputs.job_id }}" "error" \
            --message "Stage B failed. See workflow run for logs." \
            --release-tag "${{ steps.jid.outputs.release_tag }}" || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ steps.jid.outputs.job_id }}/status.json" || true
          git commit -m "clipforge: job ${{ steps.jid.outputs.job_id }} error (stage B)" || true
          git push || true
