name: Stage B — Produce Final Video (voiceover + subtitles, one merged MP4)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (must match an existing Stage A release: clipforge-<job_id>)"
        required: true
        type: string
      production_ref:
        description: "Where production.json lives. One of: path:<repo-path> | asset:<asset-name> | url:<https-url>"
        required: true
        type: string
        default: "path:jobs/<JOB_ID>/production.json"
      music_ref:
        description: "Optional background music for this job. Empty = no music. One of: path:<repo-path> | asset:<asset-name> | url:<https-url> — the site commits uploads to jobs/<job_id>/music.mp3 and passes path:jobs/<job_id>/music.mp3"
        required: false
        type: string
        default: ""
      enhance:
        description: "Apply the tuned quality enhancement filter chain (denoise + color grade + sharpen) to the merged video. Default true; set to false to ship unenhanced for comparison."
        required: false
        type: string
        default: "true"
      brand:
        description: "Composite the merged video into the branded 1080x1920 template (channel avatar + name, job title, follow CTA) using the persistent branding from branding/branding.json. Default true; set to false to ship unbranded. When no username is configured yet the job ships unbranded either way."
        required: false
        type: string
        default: "true"

permissions:
  contents: write

concurrency:
  group: clipforge-stage-b-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  stage_b:
    name: Stage B
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: jid
        shell: bash
        run: |
          set -euo pipefail
          jid="${{ github.event.inputs.job_id }}"
          jid="$(echo "$jid" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')"
          echo "job_id=$jid" >> "$GITHUB_OUTPUT"
          echo "release_tag=clipforge-$jid" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg installation
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1

      - name: Install Python deps
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: do NOT upgrade setuptools here. setuptools >= 81 removed the
          # bundled `pkg_resources` module, which resemble-perth 1.0.1 (the
          # Perth watermark chatterbox-tts 0.1.4 builds at init) imports at
          # module load. resemble-perth declares no dependencies, so pip never
          # installs a pkg_resources provider; without one,
          # perth.PerthImplicitWatermarker resolves to None and Chatterbox
          # dies with "TypeError: 'NoneType' object is not callable". The
          # setuptools<81 runtime pin lives in scripts/requirements.txt.
          python -m pip install --upgrade pip wheel "setuptools<81"
          # Build-time prereqs for pkuseg (see below): numpy headers plus a
          # modern Cython, both importable in the pkuseg build environment.
          # chatterbox-tts 0.1.4 requires numpy<1.26.0,>=1.24.0.
          pip install "numpy>=1.24.0,<1.26.0" cython
          # pkuseg 0.0.25 (exact pin of chatterbox-tts) has no Python 3.11
          # wheels, so pip builds it from the sdist. The sdist ships stale
          # pre-generated .cpp files produced by an old Cython that contain
          # `#include "longintrepr.h"` — a CPython internal header removed
          # in Python 3.11 — and pkuseg's setup.py only re-runs cythonize()
          # when PKG-INFO is absent (i.e. NOT in an sdist), so the stale
          # sources are compiled verbatim and the build dies with
          # "fatal error: longintrepr.h: No such file or directory".
          # Fix: unpack the sdist, delete the stale .cpp files so modern
          # Cython regenerates them from the .pyx sources, then build with
          # --no-build-isolation so setup.py's top-level `import numpy`
          # and the re-cythonization see the packages installed above.
          workdir="$(mktemp -d)"
          pip download pkuseg==0.0.25 --no-deps --no-binary :all: \
            --no-build-isolation -d "$workdir"
          tar -xzf "$workdir/pkuseg-0.0.25.tar.gz" -C "$workdir"
          find "$workdir/pkuseg-0.0.25" -name '*.cpp' -delete
          pip install "$workdir/pkuseg-0.0.25" --no-build-isolation
          rm -rf "$workdir"
          pip install -r scripts/requirements.txt

      # -------------------------------------------------------------------
      # Chatterbox TTS model weights (~6GB) live under $HF_HOME (default
      # ~/.cache/huggingface, models--ResembleAI--chatterbox) after the
      # first download. Cache that directory keyed on the pinned
      # chatterbox-tts version from scripts/requirements.txt so every run
      # after the first restores the weights instead of re-downloading.
      # -------------------------------------------------------------------
      - name: Restore Chatterbox model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-weights-${{ runner.os }}-${{
            hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            chatterbox-weights-${{ runner.os }}-

      - name: Write stage_b_running status
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_status.py "${{ steps.jid.outputs.job_id }}" "stage_b_running" \
            --message "Stage B started: producing final video (voiceover, music, subtitles)" \
            --release-tag "${{ steps.jid.outputs.release_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "jobs/${{ steps.jid.outputs.job_id }}/status.json"
          git commit -m "clipforge: job ${{ steps.jid.outputs.job_id }} stage B running" || echo "nothing to commit"
          git push || true

      - name: Load release metadata (find original video asset)
        id: relmeta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.jid.outputs.release_tag }}"
          repo="${GITHUB_REPOSITORY}"
          json="$(gh api "repos/${repo}/releases/tags/${tag}")"
          echo "$json" > work_release.json
          rid="$(python -c "import json; print(json.load(open('work_release.json'))['id'])")"
          echo "release_id=$rid" >> "$GITHUB_OUTPUT"
          rurl="$(python -c "import json; print(json.load(open('work_release.json')).get('html_url',''))")"
          echo "release_url=$rurl" >> "$GITHUB_OUTPUT"

          # Pull original asset info by name prefix.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("work_release.json"))
          for a in data.get("assets", []):
              if a["name"].startswith("original."):
                  print(f"orig_name={a['name']}")
                  print(f"orig_url={a['browser_download_url']}")
                  print(f"orig_id={a['id']}")
                  break
          PY

      - name: Download original video from release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work
          # Use gh api with Accept: octet-stream to download the private asset.
          orig_id="${{ steps.relmeta.outputs.orig_id }}"
          orig_name="${{ steps.relmeta.outputs.orig_name }}"
          if [ -z "$orig_id" ] || [ -z "$orig_name" ]; then
            echo "Could not find original video asset in release" >&2
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${orig_id}" \
            > "work/${orig_name}"
          ls -lh "work/${orig_name}"
          echo "ORIGINAL_PATH=work/${orig_name}" >> "$GITHUB_ENV"

      - name: Resolve production.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.production_ref }}"
          jid="${{ steps.jid.outputs.job_id }}"

          # Support placeholder <JOB_ID> in the default form
          ref="${ref//<JOB_ID>/$jid}"

          case "$ref" in
            path:*)
              src="${ref#path:}"
              if [ ! -f "$src" ]; then
                echo "production.json not found at repo path: $src" >&2
                exit 1
              fi
              cp "$src" work/production.json
              ;;
            url:*)
              src="${ref#url:}"
              curl -fSL --retry 3 -o work/production.json "$src"
              ;;
            asset:*)
              name="${ref#asset:}"
              tag="${{ steps.jid.outputs.release_tag }}"
              aid="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                    --jq ".assets[] | select(.name==\"$name\") | .id")"
              if [ -z "$aid" ]; then
                echo "asset not found: $name" >&2; exit 1
              fi
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" \
                > work/production.json
              ;;
            *)
              echo "Unknown production_ref format: $ref" >&2; exit 1;;
          esac

          echo "production.json head:"
          head -c 400 work/production.json; echo

          # Extract the one-per-job title the analysis agent put in
          # production.json (see generate_analysis_prompt.py). Optional: a
          # missing/blank title exports an empty string and the rest of
          # the pipeline ships without a title line.
          JOB_TITLE=$(python -c 'import json; print((json.load(open("work/production.json")).get("title") or "").strip())')
          echo "JOB_TITLE=$JOB_TITLE" >> "$GITHUB_ENV"

          if [ -n "$JOB_TITLE" ]; then
            echo "Job title: $JOB_TITLE"
          else
            echo "No top-level title in production.json (optional field)."
          fi

      - name: Resolve optional background music
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.music_ref }}"
          jid="${{ steps.jid.outputs.job_id }}"

          # Empty music_ref = no music for this job (the default path).
          if [ -z "$ref" ]; then
            echo "No music_ref supplied — final video ships without background music."
            exit 0
          fi

          ref="${ref//<JOB_ID>/$jid}"

          case "$ref" in
            path:*)
              src="${ref#path:}"
              if [ ! -f "$src" ]; then
                echo "music file not found at repo path: $src" >&2
                exit 1
              fi
              cp "$src" work/music.mp3
              ;;
            url:*)
              src="${ref#url:}"
              curl -fSL --retry 3 -o work/music.mp3 "$src"
              ;;
            asset:*)
              name="${ref#asset:}"
              tag="${{ steps.jid.outputs.release_tag }}"
              aid="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                    --jq ".assets[] | select(.name==\"$name\") | .id")"
              if [ -z "$aid" ]; then
                echo "music asset not found: $name" >&2; exit 1
              fi
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" \
                > work/music.mp3
              ;;
            *)
              echo "Unknown music_ref format: $ref" >&2; exit 1;;
          esac

          ls -lh work/music.mp3
          echo "MUSIC_PATH=work/music.mp3" >> "$GITHUB_ENV"

      # -------------------------------------------------------------------
      # Persistent channel branding (branding/branding.json on the default
      # branch, written by the site's Settings panel via the contents API).
      # It lives OUTSIDE jobs/ so the 12-hour cleanup never deletes it.
      # This step only RECORDS which branding (and which job title) this
      # run used in status.json's `extra` — actually rendering the title /
      # branding onto the video frames happens in the "Brand final video"
      # step below via scripts/brand_scenes.py.
      # -------------------------------------------------------------------
      - name: Load persistent channel branding (branding/branding.json)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os

          doc = {}
          try:
              with open("branding/branding.json", encoding="utf-8") as f:
                  doc = json.load(f)
          except FileNotFoundError:
              print("branding/branding.json not found — no branding saved yet")
          except Exception as e:
              print(f"branding/branding.json unreadable ({e}) — continuing without branding")

          username = (doc.get("username") or "").strip()
          display_name = (doc.get("display_name") or "").strip() or username
          picture = (doc.get("profile_picture") or "").strip()
          pic_present = bool(picture) and os.path.isfile(picture)
          if picture and not pic_present:
              print(f"branding picture listed but missing on disk: {picture} — ignoring")
              picture = ""

          if username:
              print(f"branding_username={username}")
              print(f"branding_display_name={display_name}")
              if picture:
                  print(f"branding_profile_picture={picture}")
          else:
              print("No branding configured (empty username) — job runs unbranded.")
          PY

      # -------------------------------------------------------------------
      # New one-pass pipeline: voiceover -> cut+mix+merge -> subtitles.
      # generate_voiceover.py    : Chatterbox TTS per cut + manifest.
      # cut_and_produce.py       : timing reconciliation, mute source audio,
      #                            mix voiceover (+ optional music), ONE
      #                            merged mobile-safe MP4 + merged voiceover.
      # generate_subtitles.py    : word-level transcribe of the merged
      #                            voiceover, burn word-by-word subtitles.
      # -------------------------------------------------------------------
      - name: Generate voiceover (Chatterbox TTS, one clip per cut)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/voiceover
          python scripts/generate_voiceover.py \
            work/production.json \
            work/voiceover
          ls -lh work/voiceover/

      - name: Cut, reconcile timing, mix voiceover (+music), merge to ONE MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/out
          MUSIC_ARG=()
          if [ -n "${MUSIC_PATH:-}" ]; then
            MUSIC_ARG=(--music "$MUSIC_PATH")
          fi
          python scripts/cut_and_produce.py \
            "$ORIGINAL_PATH" \
            work/production.json \
            work/voiceover/voiceover_manifest.json \
            work/out/final.mp4 \
            --voiceover-wav work/out/voiceover.wav \
            "${MUSIC_ARG[@]}"
          ls -lh work/out/

      # -------------------------------------------------------------------
      # Quality enhancement filter chain (optional), now applied to the ONE
      # merged final.mp4 (enhance_scenes.py picks up final.mp4 in the
      # directory it is given). Same toggle contract as before: the
      # `enhance` workflow_dispatch input maps 1:1 to the site's on/off
      # toggle. 'false' short-circuits the script to a no-op.
      # -------------------------------------------------------------------
      - name: Quality enhancement (denoise + color grade + sharpen)
        shell: bash
        env:
          ENHANCE_FLAG: ${{ github.event.inputs.enhance }}
        run: |
          set -euo pipefail
          flag="${ENHANCE_FLAG:-true}"
          case "$flag" in
            true|1|yes|on|True|TRUE)  enable_arg="--enabled" ;;
            false|0|no|off|False|FALSE) enable_arg="--no-enabled" ;;
            *)
              echo "Unrecognised enhance flag: '$flag' — defaulting to enabled." >&2
              enable_arg="--enabled"
              ;;
          esac
          echo "Quality enhancement flag: $flag -> $enable_arg"
          python scripts/enhance_scenes.py work/out "$enable_arg"

      # -------------------------------------------------------------------
      # Branded 9:16 compositor (optional), applied to the ONE merged
      # final.mp4 (brand_scenes.py picks up final.mp4 in the directory it
      # is given). Same three behavior paths as before: toggle off (no-op),
      # toggle on but no username saved yet (no-op), toggle on + username
      # configured (final.mp4 composited into the branded 1080x1920
      # template and atomically swapped in place).
      # -------------------------------------------------------------------
      - name: Brand final video (composite into the branded 9:16 template)
        shell: bash
        env:
          BRAND_FLAG: ${{ github.event.inputs.brand }}
        run: |
          set -euo pipefail
          flag="${BRAND_FLAG:-true}"
          case "$flag" in
            true|1|yes|on|True|TRUE)  enable_arg="--enabled" ;;
            false|0|no|off|False|FALSE) enable_arg="--no-enabled" ;;
            *)
              echo "Unrecognised brand flag: '$flag' — defaulting to enabled." >&2
              enable_arg="--enabled"
              ;;
          esac
          echo "Branding flag: $flag -> $enable_arg"
          python scripts/brand_scenes.py work/out "$enable_arg" \
            --title "${JOB_TITLE:-}"
          applied=false
          if [ "$enable_arg" = "--enabled" ] && [ -n "${BRANDING_USERNAME:-}" ]; then
            applied=true
          fi
          echo "branding_applied=$applied"
          echo "BRANDING_APPLIED=$applied" >> "$GITHUB_ENV"
          shopt -s nullglob
          leftovers=(work/out/*.branded.mp4)
          if [ ${#leftovers[@]} -ne 0 ]; then
            echo "Leftover temp files after branding: ${leftovers[*]}" >&2
            exit 1
          fi

      - name: Burn word-by-word subtitles into the final video
        shell: bash
        run: |
          set -euo pipefail
          # Burn into a new file, then atomically swap over final.mp4 so
          # the shipped artifact is always the subtitled one.
          python scripts/generate_subtitles.py \
            work/out/final.mp4 \
            work/out/voiceover.wav \
            work/out/final_subtitled.mp4
          mv -f work/out/final_subtitled.mp4 work/out/final.mp4
          ls -lh work/out/

      - name: Validate the merged final MP4 with ffprobe
        shell: bash
        run: |
          set -euo pipefail
          FINAL=work/out/final.mp4
          if [ ! -f "$FINAL" ]; then
            echo "FAIL: no merged final.mp4 to validate" >&2
            exit 1
          fi
          echo "=== $FINAL ==="
          echo "--- ffprobe: format info ---"
          ffprobe -v error -show_entries format=format_name,duration \
            -of default=noprint_wrappers=1 "$FINAL"
          echo "--- MP4 signature check ---"
          python3 - "$FINAL" <<'PY'
          import sys
          with open(sys.argv[1], 'rb') as f:
              sig = f.read(12)
          if sig[4:8] != b'ftyp':
              print(f'FAIL: {sys.argv[1]} is NOT a valid MP4 (missing ftyp box)', file=sys.stderr)
              sys.exit(1)
          print(f'PASS: {sys.argv[1]} has valid MP4 ftyp signature')
          PY
          echo "--- ffprobe: stream summary ---"
          ffprobe -v error -show_entries "stream=codec_type,codec_name,width,height" \
            -of default=noprint_wrappers=1 \
            "$FINAL"

      - name: Zip final artifact (the one finished video)
        shell: bash
        run: |
          set -euo pipefail
          cd work/out
          zip -q "clipforge-${{ steps.jid.outputs.job_id }}-final.zip" \
            final.mp4
          echo "Zip contents:"
          unzip -l "clipforge-${{ steps.jid.outputs.job_id }}-final.zip"
          ls -lh
          echo "FINAL_ZIP=work/out/clipforge-${{ steps.jid.outputs.job_id }}-final.zip" >> "$GITHUB_ENV"

      - name: Delete original video asset from release (no longer needed)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          orig_id="${{ steps.relmeta.outputs.orig_id }}"
          if [ -n "$orig_id" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${orig_id}" || true
          fi

      - name: Upload final zip + the finished video to the SAME release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.jid.outputs.release_tag }}
          name: "ClipForge job ${{ steps.jid.outputs.job_id }}"
          body: |
            ClipForge output.

            clipforge-job-id: ${{ steps.jid.outputs.job_id }}
            stage: complete

            Final artifacts (ONE finished, ready-to-post video):
              - final.mp4 — the merged video: all cuts concatenated,
                voiceover mixed in (source audio muted), word-by-word
                subtitles burned in, optional background music ducked
                under the voiceover when one was uploaded.
              - clipforge-${{ steps.jid.outputs.job_id }}-final.zip
                (contains just final.mp4)

            This release is automatically deleted 12 hours after creation.
          make_latest: "false"
          prerelease: true
          files: |
            ${{ env.FINAL_ZIP }}
            work/out/final.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve final asset URLs
        id: finalasset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.jid.outputs.release_tag }}"
          url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                --jq ".assets[] | select(.name | endswith(\"-final.zip\")) | .browser_download_url")"
          echo "final_url=$url" >> "$GITHUB_OUTPUT"
          mp4="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                --jq ".assets[] | select(.name == \"final.mp4\") | .browser_download_url")"
          echo "final_mp4_url=$mp4" >> "$GITHUB_OUTPUT"

      - name: Write complete status
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_status.py "${{ steps.jid.outputs.job_id }}" "complete" \
            --message "Final video is ready (one merged MP4 with voiceover and subtitles)." \
            --release-tag "${{ steps.jid.outputs.release_tag }}" \
            --release-url "${{ steps.relmeta.outputs.release_url }}" \
            --asset "final_zip=${{ steps.finalasset.outputs.final_url }}" \
            --asset "final_mp4=${{ steps.finalasset.outputs.final_mp4_url }}"

          # Merge the job title + the branding this run used into status.json
          # (same inline-merge pattern Stage A uses for the asset URLs).
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("jobs") / os.environ["JID"] / "status.json"
          data = json.loads(p.read_text())
          extra = data.setdefault("extra", {})
          title = (os.environ.get("JOB_TITLE") or "").strip()
          if title:
              extra["title"] = title
          # branding_applied is true ONLY when the brand toggle was on
          # AND a username was configured for this run (exported by the
          # "Brand final video" step). Always written — a definitive false
          # is more useful to the site than an absent field.
          extra["branding_applied"] = (
              os.environ.get("BRANDING_APPLIED", "false").lower() == "true"
          )
          username = (os.environ.get("BRANDING_USERNAME") or "").strip()
          if username:
              extra["branding_username"] = username
              extra["branding_display_name"] = (os.environ.get("BRANDING_DISPLAY_NAME") or "").strip() or username
              if (os.environ.get("BRANDING_PROFILE_PICTURE") or "").strip():
                  extra["branding_profile_picture"] = os.environ["BRANDING_PROFILE_PICTURE"].strip()
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False))
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ steps.jid.outputs.job_id }}/status.json"
          git commit -m "clipforge: job ${{ steps.jid.outputs.job_id }} complete" || echo "nothing to commit"
          git push
        env:
          JID: ${{ steps.jid.outputs.job_id }}
          JOB_TITLE: ${{ env.JOB_TITLE }}
          BRANDING_APPLIED: ${{ env.BRANDING_APPLIED }}
          BRANDING_USERNAME: ${{ env.BRANDING_USERNAME }}
          BRANDING_DISPLAY_NAME: ${{ env.BRANDING_DISPLAY_NAME }}
          BRANDING_PROFILE_PICTURE: ${{ env.BRANDING_PROFILE_PICTURE }}

      - name: On failure, write error status
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_status.py "${{ steps.jid.outputs.job_id }}" "error" \
            --message "Stage B failed. See workflow run for logs." \
            --release-tag "${{ steps.jid.outputs.release_tag }}" || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ steps.jid.outputs.job_id }}/status.json" || true
          git commit -m "clipforge: job ${{ steps.jid.outputs.job_id }} error (stage B)" || true
          git push || true
