<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>ClipForge Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">CF</span>
      <div class="brand-info">
        <span class="brand-name">ClipForge</span>
        <span id="repo-badge-wrap" class="hidden">
          <span id="repo-badge" class="repo-badge"></span>
        </span>
      </div>
    </div>
    <nav id="nav" class="desktop-nav hidden">
      <a href="#/home" data-nav="home">Home</a>
      <a href="#/new" data-nav="new">New video</a>
      <a href="#/tasks" data-nav="tasks">Tasks</a>
      <a href="#/done" data-nav="done">Completed</a>
      <a href="#/series" data-nav="series">Series</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="topbar-actions">
      <button id="theme-toggle" class="btn-icon" title="Toggle theme" type="button" aria-label="Toggle theme">🌙</button>
      <button id="disconnect-btn" class="btn-icon danger hidden" title="Disconnect" type="button" aria-label="Disconnect">⏻</button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <!-- Mobile Bottom Tab Navigation -->
  <nav id="mobile-nav" class="mobile-nav hidden">
    <a href="#/home" data-nav="home" class="mobile-nav-item">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="#/new" data-nav="new" class="mobile-nav-item">
      <span class="nav-icon">✨</span>
      <span class="nav-label">New</span>
    </a>
    <a href="#/tasks" data-nav="tasks" class="mobile-nav-item">
      <span class="nav-icon">⚡</span>
      <span class="nav-label">Tasks</span>
    </a>
    <a href="#/done" data-nav="done" class="mobile-nav-item">
      <span class="nav-icon">🎬</span>
      <span class="nav-label">Done</span>
    </a>
    <a href="#/series" data-nav="series" class="mobile-nav-item">
      <span class="nav-icon">📺</span>
      <span class="nav-label">Series</span>
    </a>
    <a href="#/settings" data-nav="settings" class="mobile-nav-item">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Settings</span>
    </a>
  </nav>

  <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
